---
- name: Offline Cloudflare owned-route reconciliation fixture
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    public_hostname: serzhan-home-pve.digitalhouses.vip
    quantum_public_hostname: serzhan-home-pve-filebrowser.digitalhouses.vip
    cf_existing_ingress:
      - hostname: serzhan-home-pve.digitalhouses.vip
        service: https://192.168.11.230:8006
      - hostname: serzhan-home-pve-filebrowser.digitalhouses.vip
        service: http://192.168.11.230:8090
      - hostname: serzhan-home-pve-mediaserver-admin.digitalhouses.vip
        service: https://192.168.11.250:10000
        originRequest:
          noTLSVerify: true
          httpHostHeader: serzhan-home-pve-mediaserver-admin.digitalhouses.vip
      - service: http_status:404
    cf_pve_route:
      hostname: serzhan-home-pve.digitalhouses.vip
      service: https://192.168.11.220:8006
      originRequest:
        caPool: /etc/cloudflared/dh-pve-ca.pem
        noTLSVerify: false
    cf_quantum_route:
      hostname: serzhan-home-pve-filebrowser.digitalhouses.vip
      service: http://192.168.11.220:8090
  tasks:
    - name: Extract the two site-owned routes and preserve foreign ingress
      ansible.builtin.set_fact:
        cf_foreign_ingress: >-
          {{ cf_existing_ingress | selectattr('hostname', 'defined')
             | rejectattr('hostname', 'in',
                          [public_hostname, quantum_public_hostname]) | list }}
        cf_previous_quantum: >-
          {{ cf_existing_ingress | selectattr('hostname', 'defined')
             | selectattr('hostname', 'equalto', quantum_public_hostname) | list }}

    - name: Render routes with Quantum installed
      ansible.builtin.set_fact:
        installed_ingress: >-
          {{ [cf_pve_route] + [cf_quantum_route] + cf_foreign_ingress
             + [{'service': 'http_status:404'}] }}
        skipped_ingress: >-
          {{ [cf_pve_route] + cf_previous_quantum + cf_foreign_ingress
             + [{'service': 'http_status:404'}] }}

    - name: Prove PVE changes target 220 without rewriting other services
      ansible.builtin.assert:
        that:
          - installed_ingress | length == 4
          - installed_ingress[0].service == 'https://192.168.11.220:8006'
          - installed_ingress[0].originRequest.noTLSVerify is sameas false
          - installed_ingress[1].service == 'http://192.168.11.220:8090'
          - installed_ingress[2] == cf_existing_ingress[2]
          - installed_ingress[-1].service == 'http_status:404'
          - skipped_ingress | length == 4
          - skipped_ingress[1] == cf_existing_ingress[1]
          - skipped_ingress[2] == cf_existing_ingress[2]
          - skipped_ingress[-1].service == 'http_status:404'
