---
# Regression guard: the live Semaphore task 30 must remain a read-only audit,
# while the unfinished deploy entrypoint remains unpublished and hard-blocked.
- name: Verify native media audit and deployment are safely separated
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    media_repo_root: "{{ playbook_dir | dirname }}"
  tasks:
    - name: Read declared Semaphore task catalog without changing it
      ansible.builtin.include_vars:
        file: "{{ media_repo_root }}/catalog/tasks.yml"
        name: media_catalog

    - name: Select only the canonical Semaphore media task
      ansible.builtin.set_fact:
        media30_catalog_matches: >-
          {{ media_catalog.tasks
             | selectattr('name', 'equalto', '30-Медиасервер')
             | list }}

    - name: Verify one media task points exclusively to the audit entrypoint
      ansible.builtin.assert:
        that:
          - media30_catalog_matches | length == 1
          - media30_catalog_matches[0].playbook == 'playbooks/media-server.yml'
          - >-
            'playbooks/media-server-deploy.yml'
            not in (media_catalog.tasks | map(attribute='playbook') | list)
        fail_msg: MEDIA30_UNFINISHED_DEPLOYMENT_MUST_NOT_BE_PUBLISHED

    - name: Read the tracked audit playbook without executing it
      ansible.builtin.slurp:
        src: "{{ media_repo_root }}/playbooks/media-server.yml"
      register: media30_audit_file

    - name: Read the blocked deployment playbook without executing it
      ansible.builtin.slurp:
        src: "{{ media_repo_root }}/playbooks/media-server-deploy.yml"
      register: media30_deploy_file

    - name: Inspect only textual entrypoint definitions
      ansible.builtin.set_fact:
        media30_audit_source: "{{ media30_audit_file.content | b64decode }}"
        media30_deploy_source: "{{ media30_deploy_file.content | b64decode }}"

    - name: Refuse accidental removal of read-only audit or deployment barriers
      ansible.builtin.assert:
        that:
          - "'MEDIA30_AUDIT_ONLY' in media30_audit_source"
          - "'media30-guest-readonly.yml' in media30_audit_source"
          - "'media-vm-apply.yml' not in media30_audit_source"
          - "'media-zfs-apply.yml' not in media30_audit_source"
          - "'media-native-apps.yml' not in media30_audit_source"
          - "'MEDIA30_DEPLOY_APPLY_BLOCKED' in media30_deploy_source"
          - "'MEDIA80_APPLY_ACCEPTANCE_PENDING' in media30_deploy_source"
          - >-
            media30_deploy_source.index('MEDIA30_DEPLOY_APPLY_BLOCKED')
            < media30_deploy_source.index('ansible.builtin.add_host:')
        fail_msg: MEDIA30_AUDIT_OR_APPLY_GATE_REGRESSION
