---
- name: Offline contract for one Cloudflare Tunnel per site
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    root: "{{ playbook_dir | dirname }}"
    site_audit: "{{ lookup('ansible.builtin.file', root ~ '/tasks/cloudflare-site-consolidation-audit.yml') | from_yaml }}"
    pve_cf: "{{ lookup('ansible.builtin.file', root ~ '/tasks/pve-cloudflare.yml') | from_yaml }}"
    semaphore: "{{ lookup('ansible.builtin.file', root ~ '/playbooks/configure-dev-semaphore.yml') | from_yaml }}"
    webmin: "{{ lookup('ansible.builtin.file', root ~ '/playbooks/media-webmin-cloudflare.yml') | from_yaml }}"
    catalog: "{{ lookup('ansible.builtin.file', root ~ '/catalog/tasks.yml') | from_yaml }}"
    sample_existing:
      - {name: serzhan-home, status: healthy, deleted_at: null, config_src: cloudflare}
      - {name: serzhan-home-pve, status: healthy, deleted_at: null, config_src: cloudflare}
      - {name: serzhan-home-semaphore, status: healthy, deleted_at: null, config_src: cloudflare}
  tasks:
    - name: Show exact site resources and preserve shared root Tunnel identity
      ansible.builtin.assert:
        that:
          - sample_existing | selectattr('name', 'equalto', 'serzhan-home') | list | length == 1
          - sample_existing | map(attribute='name') | unique | length == 3
          - site_audit | length >= 10

    - name: Ensure audit is read-only and legacy creation is disabled
      ansible.builtin.assert:
        that:
          - >-
            site_audit | selectattr('ansible.builtin.uri', 'defined')
            | map(attribute='ansible.builtin.uri')
            | selectattr('method', 'defined') | list | length == 0
          - >-
            pve_cf | selectattr('name', 'equalto',
                'Audit all site and legacy tunnels for owner-object consolidation')
            | list | length == 1
          - >-
            pve_cf | selectattr('name', 'equalto',
                'Refuse legacy service-tunnel changes until shared cutover is ready')
            | list | length == 1
          - >-
            semaphore[0].tasks | selectattr('name', 'equalto',
                'Prevent further service-scoped Semaphore Tunnel commissioning')
            | list | length == 1
          - >-
            webmin[0].tasks | selectattr('name', 'equalto',
                'Require migration before any legacy service-Tunnel Webmin write')
            | list | length == 1
          - >-
            (catalog.tasks | selectattr('name', 'equalto',
               '08-Настроить доступ DEV к Semaphore') | first).survey_vars[0].default_value == 'skip'
