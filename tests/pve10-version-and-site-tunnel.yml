---
- name: Offline contract for site Tunnel and optional component updates
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    root: "{{ playbook_dir | dirname }}"
    task_catalog: "{{ lookup('ansible.builtin.file', root ~ '/catalog/tasks.yml') | from_yaml }}"
    setup_src: "{{ lookup('ansible.builtin.file', root ~ '/playbooks/setup-pve.yml') }}"
    agent_src: "{{ lookup('ansible.builtin.file', root ~ '/tasks/pve-agent.yml') }}"
    quantum_src: "{{ lookup('ansible.builtin.file', root ~ '/tasks/pve-quantum-managed.yml') }}"
    cf_pkg_src: "{{ lookup('ansible.builtin.file', root ~ '/tasks/cloudflared-package-upgrade.yml') }}"
    cf_shared_src: "{{ lookup('ansible.builtin.file', root ~ '/tasks/pve-cloudflare.yml') }}"
    semaphore_src: "{{ lookup('ansible.builtin.file', root ~ '/tasks/semaphore-cloudflare.yml') }}"
  tasks:
    - name: Check all update survey fields default to no
      ansible.builtin.assert:
        that:
          - >-
            (task_catalog.tasks | selectattr('name', 'equalto', '10-Настроить PVE')
            | first).survey_vars | selectattr('name', 'equalto', 'DH_PVE_CF_UPDATE')
            | first | json_query('default_value') == 'no'
          - >-
            (task_catalog.tasks | selectattr('name', 'equalto', '10-Настроить PVE')
            | first).survey_vars | selectattr('name', 'equalto', 'DH_PVE_QUANTUM_UPDATE')
            | first | json_query('default_value') == 'no'
          - >-
            (task_catalog.tasks | selectattr('name', 'equalto', '10-Настроить PVE')
            | first).survey_vars | selectattr('name', 'equalto', 'DH_PVE_AGENT_UPDATE')
            | first | json_query('default_value') == 'no'

    - name: Confirm explicit update gating and no extra Cloudflare Tunnel
      ansible.builtin.assert:
        that:
          - setup_src is search('pve_tunnel_name:.*site_id')
          - >-
            lookup('ansible.builtin.file', root ~ '/playbooks/media-webmin-cloudflare.yml')
            is search('cf_tunnel_name:.*site_id')
          - "'site-cloudflare-tunnel-id' in lookup('ansible.builtin.file', root ~ '/tasks/pve-cloudflare-apply.yml')"
          - "'requested_agent_update' in agent_src"
          - "'requested_quantum_update' in quantum_src"
          - "'state: latest' in cf_pkg_src"
          - "'only_upgrade: true' in cf_pkg_src"
          - "'cf_local_update_available' in cf_pkg_src"
          - "'method: POST' not in semaphore_src"
          - "'method: PUT' not in semaphore_src"
          - "'method: DELETE' not in semaphore_src"
