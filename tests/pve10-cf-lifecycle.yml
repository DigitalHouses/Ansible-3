---
- name: Offline acceptance for PVE Cloudflare component lifecycle
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    root: "{{ playbook_dir | dirname }}"
    catalog: "{{ lookup('ansible.builtin.file', root ~ '/catalog/tasks.yml') | from_yaml }}"
    setup: "{{ lookup('ansible.builtin.file', root ~ '/playbooks/setup-pve.yml') | from_yaml }}"
    cf_main: "{{ lookup('ansible.builtin.file', root ~ '/tasks/pve-cloudflare.yml') | from_yaml }}"
    cf_impl: "{{ lookup('ansible.builtin.file', root ~ '/tasks/pve-cloudflare-apply.yml') | from_yaml }}"
    survey: >-
      {{ (catalog.tasks | selectattr('name', 'equalto', '10-Настроить PVE')
          | first).survey_vars }}
    mode: >-
      {{ survey | selectattr('name', 'equalto', 'DH_PVE_CF_ACTION') | first }}
  tasks:
    - name: Select the destructive Cloudflare block for contract checks
      ansible.builtin.set_fact:
        cf_delete_block: >-
          {{ cf_impl | selectattr('name', 'equalto',
             'Stop and delete the original site Tunnel only after all preflight checks')
             | first }}

    - name: Require exactly the three approved Cloudflare actions
      ansible.builtin.assert:
        that:
          - mode.default_value == 'skip'
          - mode['values'] | map(attribute='value') | list == ['skip', 'create', 'recreate']
          - setup[-1].vars.requested_mode is search("default\\('skip'")
          - >-
            (setup[-1].tasks | selectattr('name', 'equalto',
             'Create or recreate Cloudflare site Tunnel if selected')
             | first).when == "requested_mode != 'skip'"
          - >-
            (setup[-1].tasks | selectattr('name', 'equalto',
             'Upgrade the installed site connector package only when requested')
             | first).when is search("requested_mode != 'skip'")

    - name: Require create to preserve an existing Tunnel
      ansible.builtin.assert:
        that:
          - >-
            (cf_main | selectattr('name', 'equalto',
             'Report create on an existing site Tunnel without touching it')
             | first).when is search("requested_mode == 'create'")
          - >-
            (cf_main | selectattr('name', 'equalto',
             'Prepare a new or explicitly recreated site Tunnel')
             | first).when is search("requested_mode == 'recreate'")

    - name: Require destructive operations only after preflight and only in recreate
      ansible.builtin.assert:
        that:
          - cf_delete_block.when == 'cf_old_tunnel_exists'
          - >-
            (cf_delete_block.block | selectattr('name', 'equalto',
             'Delete only the explicitly selected old site Tunnel')
             | first)['ansible.builtin.uri'].method == 'DELETE'
          - >-
            cf_impl.index(cf_impl | selectattr('name', 'equalto',
              'Read each published DNS record before touching a Tunnel') | first)
            < cf_impl.index(cf_impl | selectattr('name', 'equalto',
              'Stop and delete the original site Tunnel only after all preflight checks') | first)
          - >-
            cf_impl.index(cf_impl | selectattr('name', 'equalto',
              'Require proven local ownership before deleting the site Tunnel') | first)
            < cf_impl.index(cf_impl | selectattr('name', 'equalto',
              'Stop and delete the original site Tunnel only after all preflight checks') | first)

    - name: Require existing DNS and full foreign ingress restoration
      ansible.builtin.assert:
        that:
          - >-
            (cf_impl | selectattr('name', 'equalto',
             'Move every old site CNAME to the new Tunnel UUID')
             | first)['ansible.builtin.uri'].body.content is search('cf_tunnel_id')
          - >-
            (cf_impl | selectattr('name', 'equalto',
             'Read back the DNS of all previously published site applications')
             | first).loop is search('cf_preserved_dns_names')
          - >-
            (cf_impl | selectattr('name', 'equalto',
             'Add only missing PVE and Quantum routes before the original routes')
             | first)['ansible.builtin.set_fact'].cf_desired_ingress
             is search('cf_ordered_ingress')
          - >-
            (cf_impl | selectattr('name', 'equalto',
             'Start the new site connector and enable it at boot')
             | first)['ansible.builtin.systemd_service'].state == 'restarted'
