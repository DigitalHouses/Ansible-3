---
# Explicit catalog of Semaphore task templates. No implicit deletion/update.
tasks:
  - name: 00-Обновить список задач
    playbook: playbooks/update-task-catalog.yml
    description: Synchronize catalog entries from the public Ansible-3 repo
  - name: "05-Ввести и проверить credentials"
    playbook: playbooks/obtain-site-credentials.yml
    description: "Ввод и замена credentials объекта, проверка доступных сервисов"
    survey_vars:
      - {name: DH_INPUT_PVE_ROOT_PASSWORD, title: "PVE — пароль root@pam (пусто = сохранить)", type: secret, target: env, required: false, values: []}
      - {name: DH_INPUT_MEDIA_ROOT_PASSWORD, title: "Media VM — пароль Linux root (пусто = сохранить)", type: secret, target: env, required: false, values: []}
      - {name: DH_INPUT_GITHUB_PROVISION_TOKEN, title: "GitHub — токен (пусто = сохранить)", type: secret, target: env, required: false, values: []}
      - {name: DH_INPUT_CLOUDFLARE_API_TOKEN, title: "Cloudflare — API токен (пусто = сохранить)", type: secret, target: env, required: false, values: []}
      - {name: DH_INPUT_MQTT_BROKER_HOST, title: "MQTT — адрес брокера (пусто = сохранить)", type: "", target: env, required: false, values: []}
      - {name: DH_INPUT_MQTT_USERNAME, title: "MQTT — логин (пусто = сохранить)", type: "", target: env, required: false, values: []}
      - {name: DH_INPUT_MQTT_PASSWORD, title: "MQTT — пароль (пусто = сохранить)", type: secret, target: env, required: false, values: []}
      - {name: DH_INPUT_PBS_ADMIN_PASSWORD, title: "PBS — пароль admin@pbs (пусто = сохранить)", type: secret, target: env, required: false, values: []}
      - {name: DH_INPUT_B2_KEY_ID, title: "Backblaze B2 — Key ID (пусто = сохранить)", type: secret, target: env, required: false, values: []}
      - {name: DH_INPUT_B2_APPLICATION_KEY, title: "Backblaze B2 — Application Key (пусто = сохранить)", type: secret, target: env, required: false, values: []}
      - {name: DH_INPUT_PVE_SNMP_COMMUNITY, title: "UPS SNMP v2c — community (пусто = сохранить)", type: secret, target: env, required: false, values: []}
      - {name: DH_INPUT_PVE_SNMP_USERNAME, title: "UPS SNMP v3 — логин (пусто = сохранить)", type: "", target: env, required: false, values: []}
      - {name: DH_INPUT_PVE_SNMP_AUTH_PASSWORD, title: "UPS SNMP v3 — Auth password (пусто = сохранить)", type: secret, target: env, required: false, values: []}
      - {name: DH_INPUT_PVE_SNMP_PRIV_PASSWORD, title: "UPS SNMP v3 — Privacy password (пусто = сохранить)", type: secret, target: env, required: false, values: []}
  - name: "08-Настроить доступ DEV к Semaphore"
    playbook: playbooks/configure-dev-semaphore.yml
    description: "Доступ DEV к Semaphore и защищённый Cloudflare Tunnel для веб-интерфейса"
    survey_vars:
      - name: DH_SEMAPHORE_CF_ACTION
        title: "Cloudflare Tunnel для Semaphore"
        type: enum
        target: ""
        required: true
        default_value: apply
        values:
          - {name: "Настроить или проверить туннель", value: apply}
          - {name: "Проверить без изменений", value: audit}
          - {name: "Не менять Cloudflare", value: skip}
  - name: "10-Настроить PVE"
    playbook: playbooks/setup-pve.yml
    description: "PVE 8 postinstall, Bonjour, NUT, Quantum, PVE Agent, сеть и Cloudflare Access PVE"
    survey_vars:
      - name: DH_PVE_MODE
        title: "Режим №10"
        type: enum
        target: ""
        required: true
        default_value: audit
        values:
          - {name: "Аудит PVE — без изменений на хосте", value: audit}
          - {name: "Применить настройки", value: apply}
      - name: DH_PVE_REPO_MODE
        title: "PVE APT-репозитории"
        type: enum
        target: ""
        required: true
        default_value: keep
        values:
          - {name: "Не изменять текущие", value: keep}
          - {name: "No-subscription (PVE 8, без лицензии)", value: nosub}
      - name: DH_PVE_UPGRADE
        title: "Обновить пакеты PVE"
        type: enum
        target: ""
        required: true
        default_value: "no"
        values:
          - {name: "Нет", value: "no"}
          - {name: "Да, без перезагрузки", value: "yes"}
      - name: DH_PVE_NETWORK_ACTION
        title: "PVE management IP"
        type: enum
        target: ""
        required: true
        default_value: keep
        values:
          - {name: "Оставить существующий IP", value: keep}
          - {name: "Сменить IP с автоматическим rollback", value: migrate}
      - {name: DH_PVE_NEW_IP, title: "Новый IP PVE (для migrate, например 192.168.11.230)", type: "", target: "", required: false, values: []}
      - name: DH_PVE_CF_ACTION
        title: "Cloudflare Access к PVE и File Browser"
        type: enum
        target: ""
        required: true
        default_value: apply
        values:
          - {name: "Не менять Cloudflare", value: skip}
          - {name: "Проверить туннель и Access", value: audit}
          - {name: "Обновить PVE и опубликовать File Browser", value: apply}
      - name: DH_PVE_QUANTUM
        title: "FileBrowser Quantum"
        type: enum
        target: ""
        required: true
        default_value: install
        values:
          - {name: "Установить / проверить", value: install}
          - {name: "Пропустить", value: skip}
      - name: DH_PVE_UPS_MODE
        title: "UPS — подключение"
        type: enum
        target: ""
        required: true
        default_value: none
        values:
          - {name: "Нет UPS / не настраивать", value: none}
          - {name: "USB — подключён к PVE", value: usb}
          - {name: "Сетевой — SNMP v2c", value: snmp_v2c}
          - {name: "Сетевой — SNMP v3", value: snmp_v3}
      - {name: DH_PVE_UPS_IP, title: "UPS — IP (только для сетевого)", type: "", target: "", required: false, values: []}
      - name: DH_PVE_UPS_DRIVER
        title: "UPS — драйвер NUT"
        type: enum
        target: ""
        required: true
        default_value: auto
        values:
          - {name: "Auto (рекомендуется)", value: auto}
          - {name: "usbhid-ups — USB HID", value: usbhid-ups}
          - {name: "nutdrv_qx — Qx/Megatec USB", value: nutdrv_qx}
          - {name: "blazer_usb — старый Megatec USB", value: blazer_usb}
          - {name: "bcmxcp_usb — Eaton USB", value: bcmxcp_usb}
          - {name: "tripplite_usb — старый Tripp Lite USB", value: tripplite_usb}
          - {name: "snmp-ups — сетевой", value: snmp-ups}
  - name: "30-Медиасервер"
    playbook: playbooks/media-server-deploy.yml
    description: "Медиасервер: аудит или установка; VM keep/create/recreate; SATA import/erase"
    survey_vars:
      - name: DH_MEDIA_MODE
        title: "Режим №30"
        type: enum
        target: ""
        required: true
        default_value: audit
        values:
          - {name: "Аудит — без изменений", value: audit}
          - {name: "Применить конфигурацию медиасервера", value: apply}
      - name: DH_MEDIA_VM_ACTION
        title: "Действие с VM"
        type: enum
        target: ""
        required: true
        default_value: keep
        values:
          - {name: "keep — сохранить VM", value: keep}
          - {name: "create — создать отсутствующую VM", value: create}
          - {name: "recreate — пересоздать существующую VM", value: recreate}
      - name: DH_MEDIA_DISK_ACTION
        title: "Действие с SATA-диском"
        type: enum
        target: ""
        required: true
        default_value: import
        values:
          - {name: "import — импортировать существующий ZFS, не стирать", value: import}
          - {name: "erase — СТЕРЕТЬ выбранный SATA-диск и создать ZFS заново", value: erase}
      - {name: DH_MEDIA_IP, title: "IP медиасервера (232 или полный IPv4 в LAN)", type: "", target: "", required: true, default_value: "232", values: []}
      - {name: DH_MEDIA_VM_CPU_PERCENT, title: "CPU всей VM (%) — например 150, пусто = manifest", type: "", target: "", required: false, values: []}
      - {name: DH_MEDIA_TRANSCODE_CPU_PERCENT, title: "CPU Plex+Jellyfin общий (%) — например 150, пусто = manifest", type: "", target: "", required: false, values: []}
  - name: "31-Сменить общий пароль медиасервера"
    playbook: playbooks/media-password-rotate.yml
    description: "Верификация либо защищённая native-ротация пароля SMB и медиаприложений; пароль не передаётся в Semaphore"
    survey_vars:
      - name: DH_MEDIA_ROTATION_MODE
        title: "Режим смены общего пароля"
        type: enum
        target: ""
        required: true
        default_value: preflight
        values:
          - {name: "Проверить текущие логины — без смены пароля", value: preflight}
          - {name: "Сменить пароль — только при наличии защищённого запроса на ZFS", value: apply}
  - name: "32-Cloudflare Webmin"
    playbook: playbooks/media-webmin-cloudflare.yml
    description: "Защищённая публикация Webmin медиасервера через существующий PVE Tunnel и Cloudflare Access"
    survey_vars:
      - name: DH_MEDIA_WEBMIN_CF_ACTION
        title: "Cloudflare Webmin — действие"
        type: enum
        target: ""
        required: true
        default_value: audit
        values:
          - {name: "Проверить без изменений", value: audit}
          - {name: "Опубликовать Webmin через защищённый Tunnel", value: apply}
  - name: "33-rclone Web GUI"
    playbook: playbooks/media-rclone-gui.yml
    description: "rclone 1.76, Restic 0.19.1, PBS 4.2+ и создание ZFS pbs-<owner> на существующем медиапуле; без VM/дискового lifecycle или backup jobs"
