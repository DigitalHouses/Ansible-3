---
# Explicit catalog of Semaphore task templates. No implicit deletion/update.
tasks:
  - name: 00-Обновить список задач
    playbook: playbooks/update-task-catalog.yml
    description: Synchronize catalog entries from the public Ansible-3 repo
  - name: "05-Ввести и проверить credentials"
    playbook: playbooks/obtain-site-credentials.yml
    description: "Enter or replace site credentials, then verify available services"
    survey_vars:
      - {name: DH_INPUT_PVE_ROOT_PASSWORD, title: "PVE root@pam password (blank = keep)", type: secret, target: env, required: false, values: []}
      - {name: DH_INPUT_GITHUB_PROVISION_TOKEN, title: "GitHub site repository token (blank = keep)", type: secret, target: env, required: false, values: []}
      - {name: DH_INPUT_CLOUDFLARE_API_TOKEN, title: "Cloudflare API token (blank = keep)", type: secret, target: env, required: false, values: []}
      - {name: DH_INPUT_MQTT_BROKER_HOST, title: "MQTT broker host (blank = keep)", type: "", target: env, required: false, values: []}
      - {name: DH_INPUT_MQTT_USERNAME, title: "MQTT username (blank = keep)", type: "", target: env, required: false, values: []}
      - {name: DH_INPUT_MQTT_PASSWORD, title: "MQTT password (blank = keep)", type: secret, target: env, required: false, values: []}
      - {name: DH_INPUT_PBS_ADMIN_PASSWORD, title: "PBS admin@pbs password (blank = keep)", type: secret, target: env, required: false, values: []}
      - {name: DH_INPUT_B2_KEY_ID, title: "Backblaze B2 Key ID (blank = keep)", type: secret, target: env, required: false, values: []}
      - {name: DH_INPUT_B2_APPLICATION_KEY, title: "Backblaze B2 Application Key (blank = keep)", type: secret, target: env, required: false, values: []}
