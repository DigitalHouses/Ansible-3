---
# One-time cutover to a single native Semaphore HTTP listener on port 80.
# Cloudflare Access remains in front of the public hostname (public HTTPS).
# No proxy, no extra daemon, and no custom Python.
- name: Cut over the existing site Semaphore and dedicated Cloudflare Tunnel to HTTP port 80
  hosts: runner
  connection: local
  become: true
  gather_facts: false
  vars:
    sem_site_id: "{{ lookup('ansible.builtin.file', '/etc/digitalhouses/site-id') | trim }}"
    sem_cf_token: "{{ DH_CLOUDFLARE_API_TOKEN | default('', true) }}"
    sem_cf_api: https://api.cloudflare.com/client/v4
    sem_cf_headers:
      Authorization: "Bearer {{ sem_cf_token }}"
      Accept: application/json
    sem_cf_hostname: "{{ sem_site_id }}-pve-semaphore.digitalhouses.vip"
    sem_cf_tunnel_name: "{{ sem_site_id }}-semaphore"
    sem_cf_old_ingress:
      - hostname: "{{ sem_cf_hostname }}"
        service: https://127.0.0.1:3000
        originRequest:
          caPool: /etc/semaphore/tls.crt
          noTLSVerify: false
      - service: http_status:404
    sem_cf_new_ingress:
      - hostname: "{{ sem_cf_hostname }}"
        service: http://127.0.0.1:80
      - service: http_status:404
  tasks:
    - name: Require existing task 05 Cloudflare credential and exact target
      ansible.builtin.assert:
        that:
          - sem_cf_token | length > 0
          - sem_site_id == 'serzhan-home'
        fail_msg: SEMAPHORE_HTTP80_ACCESS_OR_SITE_UNAVAILABLE
      no_log: true

    - name: Confirm the currently running trusted HTTPS API
      ansible.builtin.uri:
        url: https://127.0.0.1:3000/api/ping
        ca_path: /etc/semaphore/tls.crt
        validate_certs: true
        return_content: true
        use_proxy: false
        status_code: 200
      register: sem_http80_old_ping
      changed_when: false

    - name: Require the old listener to respond correctly
      ansible.builtin.assert:
        that: sem_http80_old_ping.content | trim == 'pong'

    - name: Reject an occupied port 80
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 80
        state: stopped
        timeout: 1

    - name: Read existing Semaphore config without disclosing secrets
      ansible.builtin.slurp:
        src: /etc/semaphore/config.json
      register: sem_http80_old_config
      no_log: true

    - name: Verify the one expected HTTPS origin before modifying it
      ansible.builtin.assert:
        that:
          - (sem_http80_old_config.content | b64decode | from_json).port == ':3000'
          - (sem_http80_old_config.content | b64decode | from_json).tls.enabled | bool
          - (sem_http80_old_config.content | b64decode | from_json).web_host == '/'
        fail_msg: SEMAPHORE_HTTP80_UNEXPECTED_OLD_LOCAL_CONFIGURATION

    - name: Read Cloudflare account associated with the verified zone
      ansible.builtin.uri:
        url: "{{ sem_cf_api }}/zones?name=digitalhouses.vip&per_page=50"
        headers: "{{ sem_cf_headers }}"
        use_proxy: false
        status_code: 200
        timeout: 25
      register: sem_http80_zones
      changed_when: false
      no_log: true

    - name: Require one correct Cloudflare zone
      ansible.builtin.assert:
        that:
          - sem_http80_zones.json.success | bool
          - sem_http80_zones.json.result | selectattr('name', 'equalto', 'digitalhouses.vip') | list | length == 1

    - name: Identify the approved Cloudflare account
      ansible.builtin.set_fact:
        sem_http80_account_id: "{{ (sem_http80_zones.json.result | selectattr('name', 'equalto', 'digitalhouses.vip') | first).account.id }}"

    - name: Discover only the existing Semaphore Tunnel
      ansible.builtin.uri:
        url: "{{ sem_cf_api }}/accounts/{{ sem_http80_account_id }}/cfd_tunnel?name={{ sem_cf_tunnel_name }}&per_page=50"
        headers: "{{ sem_cf_headers }}"
        use_proxy: false
        status_code: 200
        timeout: 25
      register: sem_http80_tunnels
      changed_when: false
      no_log: true

    - name: Select exactly the pre-existing, remotely managed Tunnel
      ansible.builtin.set_fact:
        sem_http80_matches: "{{ sem_http80_tunnels.json.result | selectattr('name', 'equalto', sem_cf_tunnel_name) | list }}"

    - name: Refuse modifying any other Cloudflare Tunnel
      ansible.builtin.assert:
        that:
          - sem_http80_matches | length == 1
          - sem_http80_matches[0].config_src == 'cloudflare'
        fail_msg: SEMAPHORE_HTTP80_TUNNEL_IDENTITY_MISMATCH

    - name: Read the current Cloudflare Tunnel route
      ansible.builtin.uri:
        url: "{{ sem_cf_api }}/accounts/{{ sem_http80_account_id }}/cfd_tunnel/{{ sem_http80_matches[0].id }}/configurations"
        headers: "{{ sem_cf_headers }}"
        use_proxy: false
        status_code: 200
        timeout: 25
      register: sem_http80_remote_config
      changed_when: false
      no_log: true

    - name: Require exact existing HTTPS origin and no unknown ingress entries
      ansible.builtin.assert:
        that:
          - sem_http80_remote_config.json.success | bool
          - sem_http80_remote_config.json.result.config.ingress == sem_cf_old_ingress
        fail_msg: SEMAPHORE_HTTP80_FOREIGN_CLOUDFLARE_INGRESS

    - name: Preserve original Semaphore config for local rollback
      ansible.builtin.copy:
        src: /etc/semaphore/config.json
        dest: /etc/semaphore/config.json.backup-https3000-20261107
        remote_src: true
        owner: root
        group: semaphore
        mode: '0640'
        force: false
      no_log: true

    - name: Grant the native unprivileged Semaphore service permission to bind port 80
      ansible.builtin.lineinfile:
        path: /etc/systemd/system/digitalhouses-semaphore.service
        insertafter: '^\[Service\]$'
        regexp: '^AmbientCapabilities='
        line: AmbientCapabilities=CAP_NET_BIND_SERVICE
        state: present
        owner: root
        group: root
        mode: '0644'
      register: sem_http80_unit_changed

    - name: Write native Semaphore HTTP 80 config preserving all keys and credentials
      ansible.builtin.copy:
        dest: /etc/semaphore/config.json
        content: >-
          {{ ((sem_http80_old_config.content | b64decode | from_json)
            | combine({'port': ':80', 'tls': {'enabled': false}, 'web_host': '/'}))
            | to_nice_json }}
        owner: root
        group: semaphore
        mode: '0640'
      no_log: true

    - name: Reload systemd for the native port-binding capability
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Cut over only the existing public hostname to HTTP 80 origin
      ansible.builtin.uri:
        url: "{{ sem_cf_api }}/accounts/{{ sem_http80_account_id }}/cfd_tunnel/{{ sem_http80_matches[0].id }}/configurations"
        method: PUT
        headers: "{{ sem_cf_headers }}"
        body_format: json
        body:
          config:
            ingress: "{{ sem_cf_new_ingress }}"
        use_proxy: false
        status_code: 200
        timeout: 30
      register: sem_http80_remote_changed
      no_log: true

    - name: Verify the Cloudflare Tunnel now routes to HTTP 80
      ansible.builtin.uri:
        url: "{{ sem_cf_api }}/accounts/{{ sem_http80_account_id }}/cfd_tunnel/{{ sem_http80_matches[0].id }}/configurations"
        headers: "{{ sem_cf_headers }}"
        use_proxy: false
        status_code: 200
        timeout: 25
      register: sem_http80_remote_verified
      changed_when: false
      no_log: true

    - name: Require verified readback and unchanged Access-protected hostname
      ansible.builtin.assert:
        that:
          - sem_http80_remote_verified.json.result.config.ingress == sem_cf_new_ingress

    - name: Queue native Semaphore restart after this job exits
      ansible.builtin.command:
        argv:
          - /usr/bin/systemd-run
          - --collect
          - --unit=digitalhouses-semaphore-http80-activate
          - --on-active=12s
          - /usr/bin/systemctl
          - restart
          - digitalhouses-semaphore.service
      changed_when: true

    - name: Report prepared coordinated cutover without claiming browser success
      ansible.builtin.debug:
        msg: "SEMAPHORE_HTTP80_CUTOVER_STAGED: local http://192.168.11.231 and external Cloudflare HTTPS; verify after restart"
