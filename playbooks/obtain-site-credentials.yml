---
# One operator task: store only submitted fields in Semaphore's native Variable
# Group and verify credentials supported without custom Python or insecure TLS.
- name: 05 - Obtain and verify site credentials
  hosts: runner
  connection: local
  gather_facts: false
  become: false
  vars_files:
    - /etc/digitalhouses/pve.yml
  vars:
    sem_api: https://127.0.0.1:3000/api
    sem_ca: /etc/semaphore/tls.crt
    site_id: "{{ lookup('ansible.builtin.file', '/etc/digitalhouses/site-id') | trim }}"
    provided:
      DH_PVE_ROOT_PASSWORD: "{{ lookup('ansible.builtin.env', 'DH_INPUT_PVE_ROOT_PASSWORD') }}"
      DH_GITHUB_PROVISION_TOKEN: "{{ lookup('ansible.builtin.env', 'DH_INPUT_GITHUB_PROVISION_TOKEN') }}"
      DH_CLOUDFLARE_API_TOKEN: "{{ lookup('ansible.builtin.env', 'DH_INPUT_CLOUDFLARE_API_TOKEN') }}"
      DH_MQTT_BROKER_HOST: "{{ lookup('ansible.builtin.env', 'DH_INPUT_MQTT_BROKER_HOST') }}"
      DH_MQTT_USERNAME: "{{ lookup('ansible.builtin.env', 'DH_INPUT_MQTT_USERNAME') }}"
      DH_MQTT_PASSWORD: "{{ lookup('ansible.builtin.env', 'DH_INPUT_MQTT_PASSWORD') }}"
      DH_PBS_ADMIN_PASSWORD: "{{ lookup('ansible.builtin.env', 'DH_INPUT_PBS_ADMIN_PASSWORD') }}"
      DH_B2_KEY_ID: "{{ lookup('ansible.builtin.env', 'DH_INPUT_B2_KEY_ID') }}"
      DH_B2_APPLICATION_KEY: "{{ lookup('ansible.builtin.env', 'DH_INPUT_B2_APPLICATION_KEY') }}"
    secret_names:
      - DH_PVE_ROOT_PASSWORD
      - DH_GITHUB_PROVISION_TOKEN
      - DH_CLOUDFLARE_API_TOKEN
      - DH_MQTT_PASSWORD
      - DH_PBS_ADMIN_PASSWORD
      - DH_B2_KEY_ID
      - DH_B2_APPLICATION_KEY
  tasks:
    - name: Select only supplied nonempty values
      ansible.builtin.set_fact:
        supplied: "{{ provided | dict2items | rejectattr('value', 'equalto', '') | list | items2dict }}"
      no_log: true

    - name: Update native Semaphore Variable Group when fields were supplied
      when: supplied | length > 0
      block:
        - name: Read existing local catalog API token
          ansible.builtin.slurp:
            src: /etc/semaphore/catalog-token
          register: token_file
          no_log: true

        - name: Find the current site project
          ansible.builtin.uri:
            url: "{{ sem_api }}/projects"
            headers:
              Authorization: "Bearer {{ token_file.content | b64decode | trim }}"
            ca_path: "{{ sem_ca }}"
            use_proxy: false
            status_code: 200
          register: projects
          no_log: true

        - name: Select the site project
          ansible.builtin.set_fact:
            matches: "{{ projects.json | selectattr('name', 'equalto', site_id) | list }}"
          no_log: true

        - name: Require exactly one site project
          ansible.builtin.assert:
            that: matches | length == 1
            fail_msg: Current site project not found

        - name: Read the current project's Variable Groups
          ansible.builtin.uri:
            url: "{{ sem_api }}/project/{{ matches[0].id }}/environment?sort=name&order=asc"
            headers:
              Authorization: "Bearer {{ token_file.content | b64decode | trim }}"
            ca_path: "{{ sem_ca }}"
            use_proxy: false
            status_code: 200
          register: sem_groups
          no_log: true

        - name: Select the bootstrap Variable Group
          ansible.builtin.set_fact:
            native_groups: "{{ sem_groups.json | selectattr('name', 'equalto', 'Empty') | list }}"
          no_log: true

        - name: Require exactly one bootstrap Variable Group
          ansible.builtin.assert:
            that: native_groups | length == 1
            fail_msg: Missing native Semaphore Variable Group

        - name: Load the native Variable Group
          ansible.builtin.uri:
            url: "{{ sem_api }}/project/{{ matches[0].id }}/environment/{{ native_groups[0].id }}"
            headers:
              Authorization: "Bearer {{ token_file.content | b64decode | trim }}"
            ca_path: "{{ sem_ca }}"
            use_proxy: false
            status_code: 200
          register: group_info
          no_log: true

        - name: Preserve existing values and prepare submitted updates
          ansible.builtin.set_fact:
            existing_env: "{{ group_info.json.env | from_json }}"
            secret_ops: []
          no_log: true

        - name: Prepare only submitted native secret upserts
          ansible.builtin.set_fact:
            secret_ops: >-
              {{ secret_ops + [
                {'name': item, 'type': 'var',
                 'secret': supplied[item],
                 'operation': 'update' if current | length else 'create'}
                 | combine({'id': current[0].id} if current | length else {})
              ] }}
          vars:
            current: "{{ group_info.json.secrets | default([]) | selectattr('name', 'equalto', item) | list }}"
          loop: "{{ secret_names }}"
          when: item in supplied
          no_log: true

        - name: Merge only submitted nonsecret MQTT settings
          ansible.builtin.set_fact:
            updated_env: >-
              {{ existing_env
                 | combine({'DH_MQTT_BROKER_HOST': supplied.DH_MQTT_BROKER_HOST}
                           if 'DH_MQTT_BROKER_HOST' in supplied else {})
                 | combine({'DH_MQTT_USERNAME': supplied.DH_MQTT_USERNAME}
                           if 'DH_MQTT_USERNAME' in supplied else {}) }}
          no_log: true

        - name: Save submitted credentials without clearing other fields
          ansible.builtin.uri:
            url: "{{ sem_api }}/project/{{ matches[0].id }}/environment/{{ native_groups[0].id }}"
            method: PUT
            body_format: json
            body:
              id: "{{ native_groups[0].id }}"
              project_id: "{{ matches[0].id }}"
              name: Empty
              json: "{{ group_info.json.json }}"
              env: "{{ updated_env | to_json }}"
              secrets: "{{ secret_ops }}"
            headers:
              Authorization: "Bearer {{ token_file.content | b64decode | trim }}"
            ca_path: "{{ sem_ca }}"
            use_proxy: false
            status_code: [200, 204]
          no_log: true

    - name: Select submitted or previously stored PVE password
      ansible.builtin.set_fact:
        pve_password: "{{ supplied.DH_PVE_ROOT_PASSWORD | default(DH_PVE_ROOT_PASSWORD | default(''), true) }}"
        pve_ready: false
        login_data: {}
      no_log: true

    - name: Authenticate root to PVE with verified CA and stdin-only curl config
      ansible.builtin.command:
        argv: [/usr/bin/curl, --config, "-"]
        stdin: |
          silent
          show-error
          fail-with-body
          cacert = "{{ pve.ca_file }}"
          url = "https://{{ pve.ipv4 }}:8006/api2/json/access/ticket"
          request = "POST"
          header = "Content-Type: application/x-www-form-urlencoded"
          data = "username=root%40pam&password={{ pve_password | urlencode }}"
      register: pve_login
      changed_when: false
      failed_when: false
      when: pve_password | length > 0
      no_log: true

    - name: Decode successful PVE login
      ansible.builtin.set_fact:
        login_data: "{{ pve_login.stdout | from_json }}"
      when: pve_login is not skipped and pve_login.rc == 0
      no_log: true

    - name: Verify access to the expected PVE node
      ansible.builtin.command:
        argv: [/usr/bin/curl, --config, "-"]
        stdin: |
          silent
          show-error
          fail-with-body
          cacert = "{{ pve.ca_file }}"
          url = "https://{{ pve.ipv4 }}:8006/api2/json/nodes"
          header = "Cookie: PVEAuthCookie={{ login_data.data.ticket }}"
      register: pve_nodes
      changed_when: false
      failed_when: false
      when: (login_data.data | default({})).ticket | default('') | length > 0
      no_log: true

    - name: Confirm that the actual PVE node is accessible
      ansible.builtin.set_fact:
        pve_ready: >-
          {{ (pve_nodes.stdout | from_json).data
             | selectattr('node', 'equalto', pve.node) | list | length > 0 }}
      when: pve_nodes is not skipped and pve_nodes.rc == 0
      no_log: true

    - name: Select submitted or previously stored cloud credentials
      ansible.builtin.set_fact:
        github_token: "{{ supplied.DH_GITHUB_PROVISION_TOKEN | default(DH_GITHUB_PROVISION_TOKEN | default(''), true) }}"
        cloudflare_token: "{{ supplied.DH_CLOUDFLARE_API_TOKEN | default(DH_CLOUDFLARE_API_TOKEN | default(''), true) }}"
        github_status: NOT_CONFIGURED
        cloudflare_status: NOT_CONFIGURED
      no_log: true

    - name: Classify Cloudflare credential shape without revealing it
      ansible.builtin.set_fact:
        cloudflare_credential_kind: >-
          {{ 'NOT_CONFIGURED' if cloudflare_token | length == 0
             else 'USER_API_TOKEN' if cloudflare_token.startswith('cfut_')
             else 'ACCOUNT_API_TOKEN' if cloudflare_token.startswith('cfat_')
             else 'GLOBAL_API_KEY' if cloudflare_token.startswith('cfk_')
             else 'WRANGLER_OAUTH_TOKEN' if cloudflare_token.startswith('cfoat_')
             else 'CONNECTOR_TOKEN_LIKELY'
                  if (cloudflare_token.startswith('eyJ') and cloudflare_token | length > 80)
             else 'LEGACY_API_TOKEN_SHAPE'
                  if cloudflare_token is match('^[a-zA-Z0-9]{40}$')
             else 'UNRECOGNIZED_SHAPE' }}
      no_log: true

    - name: Verify GitHub token identity without provisioning a repository
      ansible.builtin.uri:
        url: https://api.github.com/user
        headers:
          Authorization: "Bearer {{ github_token }}"
          Accept: application/vnd.github+json
        return_content: true
        status_code: [200, 401, 403]
        timeout: 12
        use_proxy: false
      register: github_result
      failed_when: false
      changed_when: false
      when: github_token | length > 0
      no_log: true

    - name: Record GitHub verification status
      ansible.builtin.set_fact:
        github_status: >-
          {{ 'VERIFIED_TOKEN' if
             (github_result.status | default(0) == 200 and
              github_result.json.login | default('') == 'DigitalHouses')
             else 'UNVERIFIED' }}
      when: github_result is not skipped
      no_log: true

    - name: Verify Cloudflare user API token (read-only)
      ansible.builtin.uri:
        url: https://api.cloudflare.com/client/v4/user/tokens/verify
        method: GET
        headers:
          Authorization: "Bearer {{ cloudflare_token }}"
          Accept: application/json
        return_content: true
        status_code: [200, 400, 401, 403, 429]
        timeout: 12
        use_proxy: false
      register: cloudflare_result
      failed_when: false
      changed_when: false
      when: cloudflare_token | length > 0
      no_log: true

    - name: Record Cloudflare user token verification
      ansible.builtin.set_fact:
        cloudflare_status: >-
          {{ 'VERIFIED_USER_TOKEN_SCOPE_UNVERIFIED' if
             (cloudflare_result.status | default(0) == 200 and
              (cloudflare_result.json | default({})).get('success', false)
              and ((cloudflare_result.json | default({})).get('result')
                   | default({}, true)).get('status') == 'active')
             else 'UNVERIFIED' }}
      when: cloudflare_result is not skipped
      no_log: true

    # Account API tokens can be rejected by the user-specific verify endpoint.
    # Use the same read-only zone API as the old PVE Tunnel task to discover
    # the account, then verify against that account's token endpoint.
    - name: Independently verify Cloudflare token via curl with stdin-only header
      ansible.builtin.command:
        argv:
          - /usr/bin/curl
          - --silent
          - --show-error
          - --output
          - /dev/null
          - --write-out
          - "%{http_code}"
          - --config
          - "-"
        stdin: |
          url = "https://api.cloudflare.com/client/v4/user/tokens/verify"
          header = "Authorization: Bearer {{ cloudflare_token }}"
          header = "Accept: application/json"
      register: cloudflare_curl_result
      failed_when: false
      changed_when: false
      when: cloudflare_token | length > 0
      no_log: true

    - name: Confirm Cloudflare access to the canonical site zone (read-only)
      ansible.builtin.uri:
        url: https://api.cloudflare.com/client/v4/zones?name=digitalhouses.vip&per_page=50
        method: GET
        headers:
          Authorization: "Bearer {{ cloudflare_token }}"
          Accept: application/json
        return_content: true
        status_code: [200, 400, 401, 403, 429]
        timeout: 12
        use_proxy: false
      register: cloudflare_zone_result
      failed_when: false
      changed_when: false
      when:
        - cloudflare_token | length > 0
        - cloudflare_status == 'UNVERIFIED'
      no_log: true

    - name: Read the account ID only from an unambiguous Cloudflare zone response
      ansible.builtin.set_fact:
        cloudflare_zone_matches: >-
          {{ (cloudflare_zone_result.json | default({})).get('result', [])
             | selectattr('name', 'equalto', 'digitalhouses.vip') | list }}
      when:
        - cloudflare_zone_result is not skipped
        - cloudflare_zone_result.status | default(0) == 200
        - (cloudflare_zone_result.json | default({})).get('success', false)
      no_log: true

    - name: Verify Cloudflare account API token (read-only)
      ansible.builtin.uri:
        url: >-
          https://api.cloudflare.com/client/v4/accounts/{{
          cloudflare_zone_matches[0].account.id }}/tokens/verify
        method: GET
        headers:
          Authorization: "Bearer {{ cloudflare_token }}"
          Accept: application/json
        return_content: true
        status_code: [200, 400, 401, 403, 429]
        timeout: 12
        use_proxy: false
      register: cloudflare_account_result
      changed_when: false
      failed_when: false
      when:
        - cloudflare_zone_matches | default([]) | length == 1
        - cloudflare_zone_matches[0].account.id is match('^[a-f0-9]{32}$')
      no_log: true

    - name: Confirm account token validity or scoped zone read without guessing write access
      ansible.builtin.set_fact:
        cloudflare_status: >-
          {{ 'VERIFIED_ACCOUNT_TOKEN_SCOPE_UNVERIFIED' if
             (cloudflare_account_result.status | default(0) == 200
              and (cloudflare_account_result.json | default({})).get('success', false)
              and ((cloudflare_account_result.json | default({})).get('result')
                   | default({}, true)).get('status') == 'active')
             else 'VERIFIED_ZONE_READ_TOKEN_SCOPE_UNVERIFIED'
                  if cloudflare_zone_matches | default([]) | length == 1
             else cloudflare_status }}
      when: cloudflare_token | length > 0
      no_log: true

    - name: Report credential readiness without printing values
      ansible.builtin.debug:
        msg:
          - "PVE={{ 'VERIFIED' if pve_ready else 'NOT_READY' }}"
          - "GitHub={{ github_status }}"
          - "Cloudflare={{ cloudflare_status }}"
          - "Cloudflare_HTTP={{ cloudflare_result.status | default('NOT_RUN') }}"
          - "Cloudflare_Credential_Kind={{ cloudflare_credential_kind }}"
          - >-
            Cloudflare_Token_Format={{
              'MATCHES_PUBLISHED_SHAPE' if
                cloudflare_token is match('^cfut_[A-Za-z0-9_-]{40}[A-Fa-f0-9]{8}
              else 'INVALID_SCANNABLE_SHAPE' if cloudflare_credential_kind == 'USER_API_TOKEN'
              else 'NOT_APPLICABLE' }}
          - "Cloudflare_Curl_HTTP={{ cloudflare_curl_result.stdout | default('NOT_RUN') }}"
          - "Cloudflare_Zone_HTTP={{ cloudflare_zone_result.status | default('NOT_RUN') }}"
          - "Cloudflare_Account_Verify_HTTP={{ cloudflare_account_result.status | default('NOT_RUN') }}"
          - >-
            Cloudflare_Token_State={{ ((cloudflare_result.json | default({})).get('result')
              | default({}, true)).get('status', 'UNKNOWN') }}
          - >-
            Cloudflare_Error_Codes={{ (cloudflare_result.json | default({})).get('errors', [])
              | default([], true) | map(attribute='code') | join(',') }}
          - >-
            Cloudflare_Error_Detail_Codes={{ ((cloudflare_result.json | default({}))
              .get('errors', []) | first | default({})).get('error_chain', [])
              | map(attribute='code') | join(',') }}
          - >-
            Cloudflare_Input_Format={{
              'MISSING' if cloudflare_token | length == 0
              else 'BEARER_PREFIX' if (cloudflare_token | trim | lower).startswith('bearer ')
              else 'OUTER_WHITESPACE' if cloudflare_token != (cloudflare_token | trim)
              else 'LINE_BREAK' if ('\n' in cloudflare_token or '\r' in cloudflare_token)
              else 'ACCOUNT_TOKEN' if cloudflare_token.startswith('cfat_')
              else 'GLOBAL_API_KEY' if cloudflare_token.startswith('cfk_')
              else 'RAW_TOKEN'
              }}
          - "MQTT/PBS/B2: submitted values stored; service authentication not yet verified"

    - name: Require verified PVE root access before infrastructure tasks
      ansible.builtin.assert:
        that: pve_ready
        fail_msg: "PVE credential is missing or cannot authenticate to the expected node. Check task 05 input."
)
              else 'INVALID_SCANNABLE_SHAPE' if cloudflare_credential_kind == 'USER_API_TOKEN'
              else 'NOT_APPLICABLE' }}
          - "Cloudflare_Curl_HTTP={{ cloudflare_curl_result.stdout | default('NOT_RUN') }}"
          - "Cloudflare_Zone_HTTP={{ cloudflare_zone_result.status | default('NOT_RUN') }}"
          - "Cloudflare_Account_Verify_HTTP={{ cloudflare_account_result.status | default('NOT_RUN') }}"
          - >-
            Cloudflare_Token_State={{ ((cloudflare_result.json | default({})).get('result')
              | default({}, true)).get('status', 'UNKNOWN') }}
          - >-
            Cloudflare_Error_Codes={{ (cloudflare_result.json | default({})).get('errors', [])
              | default([], true) | map(attribute='code') | join(',') }}
          - >-
            Cloudflare_Error_Detail_Codes={{ ((cloudflare_result.json | default({}))
              .get('errors', []) | first | default({})).get('error_chain', [])
              | map(attribute='code') | join(',') }}
          - >-
            Cloudflare_Input_Format={{
              'MISSING' if cloudflare_token | length == 0
              else 'BEARER_PREFIX' if (cloudflare_token | trim | lower).startswith('bearer ')
              else 'OUTER_WHITESPACE' if cloudflare_token != (cloudflare_token | trim)
              else 'LINE_BREAK' if ('\n' in cloudflare_token or '\r' in cloudflare_token)
              else 'ACCOUNT_TOKEN' if cloudflare_token.startswith('cfat_')
              else 'GLOBAL_API_KEY' if cloudflare_token.startswith('cfk_')
              else 'RAW_TOKEN'
              }}
          - "MQTT/PBS/B2: submitted values stored; service authentication not yet verified"

    - name: Require verified PVE root access before infrastructure tasks
      ansible.builtin.assert:
        that: pve_ready
        fail_msg: "PVE credential is missing or cannot authenticate to the expected node. Check task 05 input."
