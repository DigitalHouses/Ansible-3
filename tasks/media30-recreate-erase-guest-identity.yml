---
# Recreate+erase: revalidate the actual disk's ZFS identity after the guest
# has been recreated but before ANY service stop, pool destroy or wipefs.
# This protects against SATA target substitution between the two phases.
- name: Require an approved pre-destruction pool GUID in the site manifest
  ansible.builtin.assert:
    that:
      - (media_vm.storage.import_pool_guid | default('') | string) is match('^[0-9]{5,20}$')
    fail_msg: MEDIA30_RECREATE_ERASE_EXPECTED_GUID_MISSING

- name: Refuse an active foreign pool on the selected SATA disk
  ansible.builtin.assert:
    that:
      - media_sata_active_pools | length <= 1
      - >-
        media_sata_active_pools | length == 0
        or media_sata_active_pools[0].item == media_vm.storage.pool_name
    fail_msg: MEDIA30_RECREATE_ERASE_FOREIGN_ACTIVE_POOL

- name: Read GUID of the active pool if already imported
  ansible.builtin.command:
    argv:
      - zpool
      - get
      - -H
      - -o
      - value
      - guid
      - "{{ media_vm.storage.pool_name }}"
  register: media30_erase_active_guid
  changed_when: false
  when: media_sata_active_pools | length == 1

- name: Require the active pool to have the previously approved GUID
  ansible.builtin.assert:
    that:
      - media30_erase_active_guid.stdout | trim == media_vm.storage.import_pool_guid | string
    fail_msg: MEDIA30_RECREATE_ERASE_FOREIGN_ACTIVE_GUID
  when: media_sata_active_pools | length == 1

- name: Assemble an exact disk/partition-only ZFS label scan
  ansible.builtin.set_fact:
    media30_erase_scan_args: "{{ (media30_erase_scan_args | default([])) + ['-d', item] }}"
  loop: "{{ [media_sata_disk] + media_sata_partitions }}"
  when: media_sata_active_pools | length == 0

- name: Inspect importable old ZFS identity without importing it
  ansible.builtin.command:
    argv: "{{ ['zpool', 'import'] + media30_erase_scan_args }}"
  register: media30_erase_importable
  changed_when: false
  failed_when: false
  when: media_sata_active_pools | length == 0

- name: Validate the discovered pool labels against the approved manifest
  ansible.builtin.include_tasks: media30-erase-label-assert.yml
  when: media_sata_active_pools | length == 0

- name: Confirm both sides of destructive ZFS reidentification succeeded
  ansible.builtin.debug:
    msg:
      result: MEDIA30_RECREATE_ERASE_GUEST_DISK_IDENTITY_PASS
      sata_disk: "{{ media_sata_disk }}"
      previous_zfs_guid: "{{ media_vm.storage.import_pool_guid }}"
      previous_pool: "{{ media_vm.storage.pool_name }}"
      erased: false
