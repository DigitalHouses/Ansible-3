---
- name: Inspect owner rotation journal and exclusive lock
  ansible.builtin.stat:
    path: "/{{ media_spec.storage.pool_name }}/digitalhouses/credentials/{{ item }}"
    follow: false
  loop:
    - .dh-media-password-rotation.json
    - .dh-media-password-rotation.lock
  register: media30_rotation_pending
  no_log: true

- name: Refuse normal media changes during incomplete owner password rotation
  ansible.builtin.assert:
    that:
      - media30_rotation_pending.results | selectattr('stat.exists') | list | length == 0
    fail_msg: MEDIA30_OWNER_PASSWORD_ROTATION_PENDING_RUN_TASK31
