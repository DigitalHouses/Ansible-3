---
# The root password is taken from task 30's protected Survey when supplied.
# On create/recreate only, task 05's saved credential is a compatibility fallback.
# On keep without a new Survey password, preserve the existing VM password.
# It is never the PVE root, Webmin-only, or Samba owner password.
- name: Validate supplied Linux root password for this media VM
  ansible.builtin.assert:
    that:
      - media_root_password is string
      - media_root_password | length >= 8
      - media_root_password | length <= 128
    fail_msg: MEDIA30_ROOT_PASSWORD_INVALID
  when: media_root_password | default('', true) | length > 0
  no_log: true

- name: Apply the selected Linux root password to the media VM
  ansible.builtin.user:
    name: root
    password: >-
      {{ media_root_password | password_hash('sha512',
         ((media_site.id ~ ':' ~ (media_spec.vmid | string)) | hash('sha256'))[:16],
         rounds=656000) }}
    update_password: always
    state: present
  when: media_root_password | default('', true) | length > 0
  no_log: true

- name: Read Linux root password lock state after applying selected credential
  ansible.builtin.command:
    argv: [passwd, -S, root]
  register: media30_root_password_status
  changed_when: false
  when: media_root_password | default('', true) | length > 0
  no_log: true

- name: Require enabled Linux root password for PBS PAM authentication
  ansible.builtin.assert:
    that:
      - media30_root_password_status.stdout.split()[1] == 'P'
    fail_msg: MEDIA30_ROOT_PASSWORD_REMAINS_LOCKED
  when: media_root_password | default('', true) | length > 0
  no_log: true
