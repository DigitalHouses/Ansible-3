---
# Transactional migration of the only two legacy dh-* names in the owned PVE
# tunnel. Stage desired DNS and *both* ingress names, verify Access, then drop
# the old routes and DELETE their old DNS records. No 301/302 compatibility.
- name: Derive legacy and new exact Cloudflare hostnames
  ansible.builtin.set_fact:
    legacy_pve_hostname: "{{ 'dh-' ~ site_id ~ '-pve.' ~ cf_zone_name }}"
    legacy_quantum_hostname: "{{ 'dh-' ~ site_id ~ '-pve-filebrowser.' ~ cf_zone_name }}"
    expected_new_ingress:
      - "{{ current_cf_config.ingress[0] | combine({'hostname': public_hostname}) }}"
      - "{{ current_cf_config.ingress[1] | combine({'hostname': quantum_public_hostname}) }}"
      - "{{ current_cf_config.ingress[-1] }}"

- name: Validate current PVE tunnel is legacy, new or our exact staged cutover
  ansible.builtin.assert:
    that:
      - current_cf_config.ingress | length in [3, 4, 5]
      - current_cf_config.ingress[0].service == desired_origin
      - current_cf_config.ingress[0].originRequest.caPool == expected_ca_pool
      - current_cf_config.ingress[0].originRequest.noTLSVerify is sameas false
      - current_cf_config.ingress[1].service == ('http://' ~ pve.ipv4 ~ ':8090')
      - current_cf_config.ingress[-1].service == 'http_status:404'
      - current_cf_config.ingress[-1].hostname is not defined
      - >-
        (current_cf_config.ingress | length == 3 and
         ((current_cf_config.ingress[0].hostname == legacy_pve_hostname and
           current_cf_config.ingress[1].hostname == legacy_quantum_hostname) or
          (current_cf_config.ingress[0].hostname == public_hostname and
           current_cf_config.ingress[1].hostname == quantum_public_hostname))) or
        (current_cf_config.ingress | length == 4 and
         current_cf_config.ingress[0].hostname == public_hostname and
         current_cf_config.ingress[1].hostname == quantum_public_hostname and
         current_cf_config.ingress[2].hostname ==
           site_id ~ '-pve-mediaserver-admin.' ~ cf_zone_name and
         current_cf_config.ingress[2].service is match('^https://192[.]168[.][0-9.]+:10000$') and
         current_cf_config.ingress[2].originRequest.noTLSVerify is sameas true and
         current_cf_config.ingress[2].originRequest.httpHostHeader ==
           site_id ~ '-pve-mediaserver-admin.' ~ cf_zone_name) or
        (current_cf_config.ingress | length == 5 and
         current_cf_config.ingress[0].hostname == legacy_pve_hostname and
         current_cf_config.ingress[1].hostname == legacy_quantum_hostname and
         current_cf_config.ingress[2] == expected_new_ingress[0] and
         current_cf_config.ingress[3] == expected_new_ingress[1])
    fail_msg: "Unexpected PVE tunnel route or TLS policy; refusing Cloudflare hostname cutover"

- name: Record exact current naming state
  ansible.builtin.set_fact:
    cloudflare_hostname_state: >-
      {{ 'new' if current_cf_config.ingress[0].hostname == public_hostname else
         ('staged' if current_cf_config.ingress | length == 5 else 'legacy') }}

- name: Inspect both new and both legacy Cloudflare DNS entries
  ansible.builtin.uri:
    url: "{{ cf_api }}/zones/{{ cf_zone_id }}/dns_records?name={{ item }}&per_page=100"
    headers: "{{ cf_headers }}"
    use_proxy: false
    status_code: 200
    timeout: 20
  register: hostname_dns_preflight
  loop:
    - "{{ public_hostname }}"
    - "{{ quantum_public_hostname }}"
    - "{{ legacy_pve_hostname }}"
    - "{{ legacy_quantum_hostname }}"
  changed_when: false
  no_log: true

- name: Identify any existing DNS target distinct from the dedicated PVE tunnel
  ansible.builtin.set_fact:
    cf_target_candidate: >-
      {{ (hostname_dns_preflight.results[0].json.result | first | default({})).content
         | default('') | split('.cfargotunnel.com') | first }}

- name: Read the existing target tunnel metadata before considering DNS replacement
  ansible.builtin.uri:
    url: "{{ cf_api }}/accounts/{{ cf_account_id }}/cfd_tunnel/{{ cf_target_candidate }}"
    headers: "{{ cf_headers }}"
    use_proxy: false
    status_code: [200, 403, 404]
    timeout: 20
  register: cf_target_tunnel_metadata
  changed_when: false
  no_log: true
  when:
    - cf_target_candidate is match('^[a-f0-9-]{36}$')
    - cf_target_candidate != matching_tunnels[0].id

- name: Read the exact existing foreign tunnel ingress for ownership audit
  ansible.builtin.uri:
    url: "{{ cf_api }}/accounts/{{ cf_account_id }}/cfd_tunnel/{{ cf_target_candidate }}/configurations"
    headers: "{{ cf_headers }}"
    use_proxy: false
    status_code: [200, 403, 404]
    timeout: 20
  register: cf_target_tunnel_config
  changed_when: false
  no_log: true
  when:
    - cf_target_tunnel_metadata.status | default(0) == 200

- name: Report collision owner metadata without Cloudflare credentials
  ansible.builtin.debug:
    msg:
      - "CANONICAL_DNS_TARGET={{ cf_target_candidate | default('none') }}"
      - "DEDICATED_PVE_TUNNEL={{ matching_tunnels[0].name }}"
      - "TARGET_METADATA_HTTP={{ cf_target_tunnel_metadata.status | default('not_requested') }}"
      - "TARGET_NAME={{ cf_target_tunnel_metadata.json.result.name | default('unknown') }}"
      - "TARGET_STATUS={{ cf_target_tunnel_metadata.json.result.status | default('unknown') }}"
      - "TARGET_CONFIG_SOURCE={{ cf_target_tunnel_metadata.json.result.config_src | default('unknown') }}"
      - >-
        TARGET_PVE_ORIGIN={{ (cf_target_tunnel_config.json.result.config.ingress | default([])
          | selectattr('hostname', 'defined') | selectattr('hostname', 'equalto', public_hostname)
          | map(attribute='service') | list) }}
      - >-
        TARGET_QUANTUM_ORIGIN={{ (cf_target_tunnel_config.json.result.config.ingress | default([])
          | selectattr('hostname', 'defined') | selectattr('hostname', 'equalto', quantum_public_hostname)
          | map(attribute='service') | list) }}
      - >-
        TARGET_INGRESS={{ cf_target_tunnel_config.json.result.config.ingress | default([])
        | selectattr('hostname', 'defined') | map(attribute='hostname') | list }}
  when: cf_target_candidate | default('') != matching_tunnels[0].id

- name: Inspect whether the canonical DNS belongs to a stale same-site shared tunnel
  ansible.builtin.set_fact:
    cf_owner_pve_ingress: >-
      {{ cf_target_tunnel_config.json.result.config.ingress | default([])
         | selectattr('hostname', 'defined')
         | selectattr('hostname', 'equalto', public_hostname) | list }}
    cf_owner_quantum_ingress: >-
      {{ cf_target_tunnel_config.json.result.config.ingress | default([])
         | selectattr('hostname', 'defined')
         | selectattr('hostname', 'equalto', quantum_public_hostname) | list }}
  when:
    - cf_target_tunnel_metadata.status | default(0) == 200
    - cf_target_tunnel_config.status | default(0) == 200

- name: Allow DNS adoption only from a down same-owner legacy shared tunnel
  ansible.builtin.assert:
    that:
      - cf_target_tunnel_metadata.status == 200
      - cf_target_tunnel_config.status == 200
      - cf_target_tunnel_metadata.json.result.status == 'down'
      - cf_target_tunnel_metadata.json.result.config_src == 'cloudflare'
      - canonical_site.site.owner_slug | lower in (cf_target_tunnel_metadata.json.result.name | lower)
      - cf_owner_pve_ingress | length == 1
      - cf_owner_quantum_ingress | length == 1
      - cf_owner_pve_ingress[0].service == 'https://192.168.11.30:8006'
      - cf_owner_quantum_ingress[0].service == 'http://192.168.11.30:8080'
      - cf_target_candidate is match('^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$')
    fail_msg: "Canonical names belong to a foreign/live tunnel, refusing reassignment"
  when:
    - cf_target_candidate | default('') not in ['', matching_tunnels[0].id]

- name: Require exactly owned DNS records and no target collisions
  ansible.builtin.assert:
    that:
      - item.json.success | bool
      - item.json.result_info.total_pages | default(1) | int == 1
      - item.json.result | length <= 1
      - >-
        item.json.result | length == 0 or
        (item.json.result[0].type == 'CNAME' and
         item.json.result[0].proxied | bool and
         ((item.json.result[0].content | lower) ==
          ((matching_tunnels[0].id ~ '.cfargotunnel.com') | lower) or
          (item_index < 2 and cloudflare_hostname_state != 'new' and
           (item.json.result[0].content | lower) ==
           ((cf_target_candidate ~ '.cfargotunnel.com') | lower) and
           (cf_target_tunnel_metadata.status | default(0)) == 200)))
      - cloudflare_hostname_state == 'new' or item_index < 2 or item.json.result | length == 1
      - cloudflare_hostname_state != 'new' or item_index >= 2 or item.json.result | length == 1
    fail_msg: "Missing/foreign DNS record in PVE hostname rename preflight"
  no_log: true
  loop: "{{ hostname_dns_preflight.results }}"
  loop_control:
    index_var: item_index

- name: Detect leftover legacy DNS if a prior run stopped before cleanup
  ansible.builtin.set_fact:
    cloudflare_legacy_dns_pending: >-
      {{ hostname_dns_preflight.results[2].json.result | length > 0 or
         hostname_dns_preflight.results[3].json.result | length > 0 }}

- name: Report exact hostname cutover plan
  ansible.builtin.debug:
    msg:
      - "NAMING_STATE={{ cloudflare_hostname_state }}"
      - "PVE_PUBLIC={{ legacy_pve_hostname }} -> {{ public_hostname }}"
      - "QUANTUM_PUBLIC={{ legacy_quantum_hostname }} -> {{ quantum_public_hostname }}"
      - "DELETE_OLD_IMMEDIATELY_AFTER_ACCESS_VERIFICATION={{ requested_mode == 'apply' }}"

- name: Require restricted wildcard Access app before publishing new names
  ansible.builtin.uri:
    url: "{{ cf_api }}/accounts/{{ cf_account_id }}/access/apps?per_page=100"
    headers: "{{ cf_headers }}"
    use_proxy: false
    status_code: 200
    timeout: 20
  register: cf_cutover_access_apps
  changed_when: false
  no_log: true
  when: cloudflare_hostname_state != 'new' or cloudflare_legacy_dns_pending

- name: Select the existing protected wildcard application
  ansible.builtin.set_fact:
    cf_cutover_wildcard_apps: >-
      {{ cf_cutover_access_apps.json.result | selectattr('type', 'equalto', 'self_hosted')
         | selectattr('domain', 'defined')
         | selectattr('domain', 'equalto', '*.' ~ cf_zone_name) | list }}
    cf_cutover_exact_apps: >-
      {{ cf_cutover_access_apps.json.result | selectattr('domain', 'defined')
         | selectattr('domain', 'in', [public_hostname, quantum_public_hostname]) | list }}
  when: cloudflare_hostname_state != 'new' or cloudflare_legacy_dns_pending

- name: Refuse absent wildcard or conflicting explicit Access apps
  ansible.builtin.assert:
    that:
      - cf_cutover_access_apps.json.success | bool
      - cf_cutover_access_apps.json.result_info.total_pages | default(1) | int == 1
      - cf_cutover_wildcard_apps | length == 1
      - cf_cutover_exact_apps | length == 0
    fail_msg: "No unique restricted wildcard Cloudflare Access app covers both new PVE names"
  when: cloudflare_hostname_state != 'new' or cloudflare_legacy_dns_pending

- name: Read wildcard Access policies before introducing new hostnames
  ansible.builtin.uri:
    url: "{{ cf_api }}/accounts/{{ cf_account_id }}/access/apps/{{ cf_cutover_wildcard_apps[0].id }}/policies?per_page=100"
    headers: "{{ cf_headers }}"
    use_proxy: false
    status_code: 200
    timeout: 20
  register: cf_cutover_access_policies
  changed_when: false
  no_log: true
  when: cloudflare_hostname_state != 'new' or cloudflare_legacy_dns_pending

- name: Require allowlisted emails without bypass or everyone rules
  ansible.builtin.assert:
    that:
      - cf_cutover_access_policies.json.success | bool
      - cf_cutover_access_policies.json.result_info.total_pages | default(1) | int == 1
      - cf_cutover_access_policies.json.result | selectattr('decision', 'equalto', 'bypass') | list | length == 0
      - cf_cutover_access_policies.json.result | selectattr('decision', 'equalto', 'allow') | list | length > 0
      - >-
        cf_cutover_access_policies.json.result | map(attribute='include') | flatten
        | selectattr('everyone', 'defined') | list | length == 0
      - >-
        cf_cutover_access_policies.json.result | selectattr('decision', 'equalto', 'allow')
        | map(attribute='include') | flatten
        | selectattr('email', 'defined') | list | length > 0
    fail_msg: "Cloudflare wildcard Access is not demonstrably restricted"
  when: cloudflare_hostname_state != 'new' or cloudflare_legacy_dns_pending

- name: Create only missing new DNS CNAMEs into the owned tunnel
  ansible.builtin.uri:
    url: "{{ cf_api }}/zones/{{ cf_zone_id }}/dns_records"
    method: POST
    headers: "{{ cf_headers }}"
    body_format: json
    body:
      type: CNAME
      name: "{{ item.item }}"
      content: "{{ matching_tunnels[0].id }}.cfargotunnel.com"
      proxied: true
    use_proxy: false
    status_code: [200, 201]
    timeout: 30
  loop: "{{ hostname_dns_preflight.results[:2] }}"
  when:
    - requested_mode == 'apply'
    - cloudflare_hostname_state != 'new' or cloudflare_legacy_dns_pending
    - item.json.result | length == 0
  changed_when: true
  no_log: true

- name: Stage new hostnames while retaining both working old routes
  ansible.builtin.uri:
    url: "{{ cf_api }}/accounts/{{ cf_account_id }}/cfd_tunnel/{{ matching_tunnels[0].id }}/configurations"
    method: PUT
    headers: "{{ cf_headers }}"
    body_format: json
    body:
      config: >-
        {{ current_cf_config | combine({'ingress':
           current_cf_config.ingress[:2] + expected_new_ingress[:2] +
           [current_cf_config.ingress[-1]]}) }}
    use_proxy: false
    status_code: 200
    timeout: 30
  when:
    - requested_mode == 'apply'
    - cloudflare_hostname_state == 'legacy'
  changed_when: true
  no_log: true

- name: Verify staged dual-route configuration before removing old routes
  ansible.builtin.uri:
    url: "{{ cf_api }}/accounts/{{ cf_account_id }}/cfd_tunnel/{{ matching_tunnels[0].id }}/configurations"
    headers: "{{ cf_headers }}"
    use_proxy: false
    status_code: 200
    timeout: 20
  register: cf_staged_config
  changed_when: false
  no_log: true
  when:
    - requested_mode == 'apply'
    - cloudflare_hostname_state != 'new'

- name: Refuse any unexpected differences in staged ingress
  ansible.builtin.assert:
    that:
      - cf_staged_config.json.success | bool
      - >-
        cf_staged_config.json.result.config ==
        (current_cf_config | combine({'ingress':
          current_cf_config.ingress[:2] + expected_new_ingress[:2] +
          [current_cf_config.ingress[-1]]}))
    fail_msg: "Dual-route staging diverged; old hostnames are preserved"
  when:
    - requested_mode == 'apply'
    - cloudflare_hostname_state == 'legacy'

- name: Repoint only the two canonical CNAMEs from stale shared to dedicated PVE tunnel
  ansible.builtin.uri:
    url: "{{ cf_api }}/zones/{{ cf_zone_id }}/dns_records/{{ item.json.result[0].id }}"
    method: PATCH
    headers: "{{ cf_headers }}"
    body_format: json
    body:
      type: CNAME
      name: "{{ item.item }}"
      content: "{{ matching_tunnels[0].id }}.cfargotunnel.com"
      proxied: true
    use_proxy: false
    status_code: 200
    timeout: 30
  loop: "{{ hostname_dns_preflight.results[:2] }}"
  changed_when: true
  no_log: true
  when:
    - requested_mode == 'apply'
    - cloudflare_hostname_state != 'new'
    - item.json.result | length == 1
    - >-
      (item.json.result[0].content | lower) !=
      ((matching_tunnels[0].id ~ '.cfargotunnel.com') | lower)

- name: Resolve the active old PVE edge address for strict TLS checks
  ansible.builtin.command:
    argv: [/usr/bin/getent, ahostsv4, "{{ legacy_pve_hostname }}"]
  register: cf_cutover_edge
  changed_when: false
  when:
    - requested_mode == 'apply'
    - cloudflare_hostname_state != 'new' or cloudflare_legacy_dns_pending

- name: Validate the public Cloudflare edge IPv4 before new-host probes
  ansible.builtin.assert:
    that:
      - cf_cutover_edge.stdout_lines[0].split()[0] is match('^([0-9]{1,3}\\.){3}[0-9]{1,3}$')
    fail_msg: "Cannot pin the existing Cloudflare edge for new hostnames"
  when:
    - requested_mode == 'apply'
    - cloudflare_hostname_state != 'new' or cloudflare_legacy_dns_pending

- name: Reuse the already verified public edge for follow-up Quantum checks
  ansible.builtin.set_fact:
    cf_edge_ipv4: "{{ cf_cutover_edge.stdout_lines[0].split()[0] }}"
  when:
    - requested_mode == 'apply'
    - cloudflare_hostname_state != 'new' or cloudflare_legacy_dns_pending

- name: Verify both replacement public hosts enforce Cloudflare Access with TLS
  ansible.builtin.command:
    argv:
      - /usr/bin/curl
      - --silent
      - --show-error
      - --noproxy
      - '*'
      - --connect-timeout
      - '5'
      - --max-time
      - '15'
      - --resolve
      - "{{ item }}:443:{{ cf_cutover_edge.stdout_lines[0].split()[0] }}"
      - --output
      - /dev/null
      - --write-out
      - '%{http_code} %{redirect_url}'
      - "https://{{ item }}/"
  loop:
    - "{{ public_hostname }}"
    - "{{ quantum_public_hostname }}"
  register: cf_cutover_access_checks
  changed_when: false
  until: >-
    cf_cutover_access_checks.rc == 0 and
    cf_cutover_access_checks.stdout is
    match('^302 https://[^/]+\\.cloudflareaccess\\.com/cdn-cgi/access/login/.*')
  retries: 6
  delay: 3
  no_log: true
  when:
    - requested_mode == 'apply'
    - cloudflare_hostname_state != 'new' or cloudflare_legacy_dns_pending

- name: Verify the new DNS records exist and belong to this tunnel before cutover
  ansible.builtin.uri:
    url: "{{ cf_api }}/zones/{{ cf_zone_id }}/dns_records?name={{ item }}&per_page=100"
    headers: "{{ cf_headers }}"
    use_proxy: false
    status_code: 200
    timeout: 20
  loop:
    - "{{ public_hostname }}"
    - "{{ quantum_public_hostname }}"
  register: cf_new_dns_readback
  changed_when: false
  no_log: true
  when:
    - requested_mode == 'apply'
    - cloudflare_hostname_state != 'new' or cloudflare_legacy_dns_pending

- name: Require both new DNS CNAMEs before retiring old ones
  ansible.builtin.assert:
    that:
      - item.json.success | bool
      - item.json.result | length == 1
      - item.json.result[0].type == 'CNAME'
      - item.json.result[0].proxied | bool
      - >-
        item.json.result[0].content | lower ==
        ((matching_tunnels[0].id ~ '.cfargotunnel.com') | lower)
    fail_msg: "New Cloudflare DNS is not yet authoritative; legacy names remain"
  loop: "{{ cf_new_dns_readback.results }}"
  when:
    - requested_mode == 'apply'
    - cloudflare_hostname_state != 'new' or cloudflare_legacy_dns_pending

- name: Remove legacy ingress routes only after successful new Access checks
  ansible.builtin.uri:
    url: "{{ cf_api }}/accounts/{{ cf_account_id }}/cfd_tunnel/{{ matching_tunnels[0].id }}/configurations"
    method: PUT
    headers: "{{ cf_headers }}"
    body_format: json
    body:
      config: "{{ current_cf_config | combine({'ingress': expected_new_ingress}) }}"
    use_proxy: false
    status_code: 200
    timeout: 30
  changed_when: true
  no_log: true
  when:
    - requested_mode == 'apply'
    - cloudflare_hostname_state != 'new'

- name: Read back canonical tunnel with only unprefixed hostnames
  ansible.builtin.uri:
    url: "{{ cf_api }}/accounts/{{ cf_account_id }}/cfd_tunnel/{{ matching_tunnels[0].id }}/configurations"
    headers: "{{ cf_headers }}"
    use_proxy: false
    status_code: 200
    timeout: 20
  register: cf_final_hostname_config
  changed_when: false
  no_log: true
  when: requested_mode == 'apply'

- name: Verify no legacy ingress remains before removing legacy DNS
  ansible.builtin.assert:
    that:
      - cf_final_hostname_config.json.success | bool
      - >-
        cf_final_hostname_config.json.result.config ==
        (current_cf_config | combine({'ingress': expected_new_ingress}))
    fail_msg: "Legacy DNS kept because the new canonical tunnel readback differs"
  when: requested_mode == 'apply'

- name: Delete both retired DNS CNAMEs immediately after successful cutover
  ansible.builtin.uri:
    url: "{{ cf_api }}/zones/{{ cf_zone_id }}/dns_records/{{ item.json.result[0].id }}"
    method: DELETE
    headers: "{{ cf_headers }}"
    use_proxy: false
    status_code: 200
    timeout: 30
  loop: "{{ hostname_dns_preflight.results[2:] }}"
  changed_when: true
  no_log: true
  when:
    - requested_mode == 'apply'
    - cloudflare_legacy_dns_pending
    - item.json.result | length == 1

- name: Confirm old DNS records are absent after the irreversible cutover
  ansible.builtin.uri:
    url: "{{ cf_api }}/zones/{{ cf_zone_id }}/dns_records?name={{ item }}&per_page=100"
    headers: "{{ cf_headers }}"
    use_proxy: false
    status_code: 200
    timeout: 20
  loop:
    - "{{ legacy_pve_hostname }}"
    - "{{ legacy_quantum_hostname }}"
  register: cf_retired_dns_check
  changed_when: false
  no_log: true
  when: requested_mode == 'apply'

- name: Require immediate DNS deletion of retired dh hostnames
  ansible.builtin.assert:
    that:
      - item.json.success | bool
      - item.json.result | length == 0
    fail_msg: "Legacy prefixed Cloudflare DNS still exists"
  loop: "{{ cf_retired_dns_check.results }}"
  when: requested_mode == 'apply'

- name: Set new in-memory Cloudflare tunnel state after cutover
  ansible.builtin.set_fact:
    current_cf_config: "{{ cf_final_hostname_config.json.result.config }}"
  when: requested_mode == 'apply'
