---
# Create / recreate the one remotely-managed owner-object Tunnel.
# Recreate retains all published ingress and DNS records; only the
# locally managed Runner connector may be destroyed automatically.

- name: Verify the requested File Browser origin is healthy
  ansible.builtin.uri:
    url: "http://{{ pve.ipv4 }}:8090/health"
    use_proxy: false
    status_code: 200
    timeout: 10
  changed_when: false
  when: quantum_requested

- name: Verify File Browser does not expose anonymous administration
  ansible.builtin.uri:
    url: "http://{{ pve.ipv4 }}:8090/api/users"
    use_proxy: false
    status_code: [401, 403]
    timeout: 10
  changed_when: false
  when: quantum_requested

- name: Identify the Tunnel being explicitly recreated, if any
  ansible.builtin.set_fact:
    cf_old_tunnel_id: "{{ cf_matching_tunnels[0].id if cf_matching_tunnels | length == 1 else '' }}"
    cf_old_tunnel_exists: "{{ cf_matching_tunnels | length == 1 }}"

- name: Read existing site configuration before potential deletion
  ansible.builtin.uri:
    url: "{{ cf_api }}/accounts/{{ cf_account_id }}/cfd_tunnel/{{ cf_old_tunnel_id }}/configurations"
    headers: "{{ cf_headers }}"
    use_proxy: false
    status_code: 200
  register: cf_old_remote_config
  changed_when: false
  no_log: true
  when: cf_old_tunnel_exists

- name: Snapshot the original Cloudflare settings and ingress in memory
  ansible.builtin.set_fact:
    cf_saved_config: >-
      {{ cf_old_remote_config.json.result.config if cf_old_tunnel_exists else {} }}
    cf_saved_ingress: >-
      {{ cf_old_remote_config.json.result.config.ingress | default([])
         if cf_old_tunnel_exists else [] }}

- name: Select the routes and names to retain across recreation
  ansible.builtin.set_fact:
    cf_saved_hostnames: >-
      {{ cf_saved_ingress | selectattr('hostname', 'defined')
         | map(attribute='hostname') | list }}
    cf_required_hostnames: >-
      {{ [public_hostname] + ([quantum_public_hostname] if quantum_requested else []) }}

- name: Require a safe site-scoped ingress snapshot
  ansible.builtin.assert:
    that:
      - >-
        cf_saved_ingress | length == 0 or
        (cf_saved_ingress[-1].service == 'http_status:404'
         and cf_saved_ingress[-1].hostname is not defined)
      - >-
        cf_saved_ingress | length == 0 or
        (cf_saved_ingress[:-1] | rejectattr('hostname', 'defined')
         | list | length) == 0
      - cf_saved_hostnames | length == (cf_saved_hostnames | unique | list | length)
      - >-
        (cf_saved_hostnames | reject('match',
         '^[a-zA-Z0-9*._-]+[.]' ~ (cf_zone_name | regex_escape) ~ '$')
         | list | length) == 0
    fail_msg: "CF_RECREATE_UNSUPPORTED_INGRESS_NO_DELETION"

- name: Select all DNS records to preserve or create
  ansible.builtin.set_fact:
    cf_dns_hostnames: "{{ (cf_saved_hostnames + cf_required_hostnames) | unique | list }}"
    cf_saved_pve: >-
      {{ cf_saved_ingress | selectattr('hostname', 'defined')
         | selectattr('hostname', 'equalto', public_hostname) | list }}
    cf_saved_quantum: >-
      {{ cf_saved_ingress | selectattr('hostname', 'defined')
         | selectattr('hostname', 'equalto', quantum_public_hostname) | list }}
    cf_foreign_ingress: >-
      {{ cf_saved_ingress | selectattr('hostname', 'defined')
         | rejectattr('hostname', 'in', [public_hostname, quantum_public_hostname]) | list }}

- name: Reject weakened PVE TLS settings in saved ingress
  ansible.builtin.assert:
    that:
      - cf_saved_pve | length == 0 or (cf_saved_pve[0].originRequest.noTLSVerify | default(false)) is sameas false
      - cf_saved_pve | length == 0 or cf_saved_pve[0].originRequest.caPool | default('') == expected_ca_pool
    fail_msg: "CF_PVE_TLS_POLICY_INVALID"

- name: Read each published DNS record before touching a Tunnel
  ansible.builtin.uri:
    url: "{{ cf_api }}/zones/{{ cf_zone_id }}/dns_records?name={{ item }}&per_page=100"
    headers: "{{ cf_headers }}"
    use_proxy: false
    status_code: 200
  loop: "{{ cf_dns_hostnames }}"
  register: cf_dns_preflight
  changed_when: false
  no_log: true

- name: Refuse unrelated, unproxied or ambiguous DNS before recreation
  ansible.builtin.assert:
    that:
      - item.json.success | bool
      - item.json.result_info.total_pages | default(1) | int == 1
      - item.json.result | length <= 1
      - >-
        item.json.result | length == 0 or
        (cf_old_tunnel_exists and item.json.result[0].type == 'CNAME'
         and item.json.result[0].proxied | bool
         and (item.json.result[0].content | lower)
         == ((cf_old_tunnel_id ~ '.cfargotunnel.com') | lower))
    fail_msg: "CF_DNS_FOREIGN_OR_STALE_REQUIRES_MANUAL_REVIEW"
  loop: "{{ cf_dns_preflight.results }}"
  loop_control:
    label: "{{ item.item }}"
  no_log: true

- name: Determine exactly which DNS records existed before recreation
  ansible.builtin.set_fact:
    cf_preserved_dns_names: >-
      {{ cf_dns_preflight.results | selectattr('json.result')
         | map(attribute='item') | list }}

- name: Read the locally recorded Runner Tunnel identity
  ansible.builtin.stat:
    path: /etc/digitalhouses/site-cloudflare-tunnel-id
  register: cf_local_marker_stat
  when: cf_old_tunnel_exists

- name: Read the local Runner Tunnel ownership marker
  ansible.builtin.slurp:
    src: /etc/digitalhouses/site-cloudflare-tunnel-id
  register: cf_local_marker
  no_log: true
  when:
    - cf_old_tunnel_exists
    - cf_local_marker_stat.stat.isreg | default(false)

- name: Check the managed connector unit before destructive recreation
  ansible.builtin.stat:
    path: /etc/systemd/system/digitalhouses-site-cloudflared.service
  register: cf_local_service_stat
  when: cf_old_tunnel_exists

- name: Require proven local ownership before deleting the site Tunnel
  ansible.builtin.assert:
    that:
      - cf_local_marker_stat.stat.isreg | default(false)
      - (cf_local_marker.content | default('') | b64decode | trim) == cf_old_tunnel_id
      - cf_local_service_stat.stat.isreg | default(false)
    fail_msg: "CF_RECREATE_NEEDS_RUNNER_OWNERSHIP_NO_DELETION"
  when: cf_old_tunnel_exists

- name: Confirm the saved Tunnel configuration has not changed before deletion
  ansible.builtin.uri:
    url: "{{ cf_api }}/accounts/{{ cf_account_id }}/cfd_tunnel/{{ cf_old_tunnel_id }}/configurations"
    headers: "{{ cf_headers }}"
    use_proxy: false
    status_code: 200
  register: cf_old_predelete_config
  changed_when: false
  no_log: true
  when: cf_old_tunnel_exists

- name: Refuse concurrent modifications to the site Tunnel before recreation
  ansible.builtin.assert:
    that:
      - cf_old_predelete_config.json.result.config == cf_saved_config
    fail_msg: "CF_TUNNEL_CHANGED_BEFORE_DELETE"
  when: cf_old_tunnel_exists

- name: Stop and delete the original site Tunnel only after all preflight checks
  when: cf_old_tunnel_exists
  block:
    - name: Stop the locally managed site connector
      ansible.builtin.systemd_service:
        name: digitalhouses-site-cloudflared.service
        state: stopped

    - name: Require all old Tunnel connections to close
      ansible.builtin.uri:
        url: "{{ cf_api }}/accounts/{{ cf_account_id }}/cfd_tunnel/{{ cf_old_tunnel_id }}"
        headers: "{{ cf_headers }}"
        use_proxy: false
        status_code: 200
      register: cf_old_tunnel_down
      changed_when: false
      until: cf_old_tunnel_down.json.result.status in ['down', 'inactive']
      retries: 12
      delay: 3
      no_log: true

    - name: Delete only the explicitly selected old site Tunnel
      ansible.builtin.uri:
        url: "{{ cf_api }}/accounts/{{ cf_account_id }}/cfd_tunnel/{{ cf_old_tunnel_id }}"
        method: DELETE
        headers: "{{ cf_headers }}"
        use_proxy: false
        status_code: [200, 204]
      changed_when: true
      no_log: true
  rescue:
    - name: Restart old connector after a failed Tunnel deletion
      ansible.builtin.systemd_service:
        name: digitalhouses-site-cloudflared.service
        state: started

    - name: Report failed recreation with original configuration retained
      ansible.builtin.fail:
        msg: "CF_RECREATE_DELETE_FAILED_OLD_CONNECTOR_RESTARTED"

- name: Create the one canonical remotely managed Cloudflare Tunnel
  ansible.builtin.uri:
    url: "{{ cf_api }}/accounts/{{ cf_account_id }}/cfd_tunnel"
    method: POST
    headers: "{{ cf_headers }}"
    body_format: json
    body:
      name: "{{ pve_tunnel_name }}"
      config_src: cloudflare
    use_proxy: false
    status_code: 200
  register: cf_new_tunnel
  changed_when: true
  no_log: true

- name: Remember the new Cloudflare Tunnel UUID
  ansible.builtin.set_fact:
    cf_tunnel_id: "{{ cf_new_tunnel.json.result.id }}"

- name: Verify the new Tunnel was created with the canonical identity
  ansible.builtin.assert:
    that:
      - cf_new_tunnel.json.success | bool
      - cf_new_tunnel.json.result.name == pve_tunnel_name
      - cf_tunnel_id is match('^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$')
      - cf_tunnel_id != cf_old_tunnel_id
    fail_msg: "CF_NEW_TUNNEL_INVALID"

- name: Read Cloudflare's initial configuration on the new Tunnel
  ansible.builtin.uri:
    url: "{{ cf_api }}/accounts/{{ cf_account_id }}/cfd_tunnel/{{ cf_tunnel_id }}/configurations"
    headers: "{{ cf_headers }}"
    use_proxy: false
    status_code: 200
  register: cf_initial_config
  changed_when: false
  no_log: true

- name: Refuse non-default ingress created by someone else
  ansible.builtin.assert:
    that:
      - cf_initial_config.json.success | bool
      - cf_initial_config.json.result.config.ingress | default([]) in [[], [{'service':'http_status:404'}]]
    fail_msg: "CF_NEW_TUNNEL_ALREADY_MODIFIED"

- name: Build canonical PVE and Quantum routes plus preserved foreign routes
  ansible.builtin.set_fact:
    cf_new_pve_ingress: >-
      {{ (cf_saved_pve[0] if cf_saved_pve | length == 1 else
           {'hostname': public_hostname})
         | combine({'service': desired_origin,
                    'originRequest': {'caPool': expected_ca_pool, 'noTLSVerify': false}},
                   recursive=true) }}
    cf_new_quantum_ingress: >-
      {{ (cf_saved_quantum[0] if cf_saved_quantum | length == 1 else
           {'hostname': quantum_public_hostname})
         | combine({'service': 'http://' ~ pve.ipv4 ~ ':8090'}) }}

- name: Start from the original ingress order
  ansible.builtin.set_fact:
    cf_ordered_ingress: []

- name: Preserve every original route position and unrelated settings
  ansible.builtin.set_fact:
    cf_ordered_ingress: >-
      {{ cf_ordered_ingress +
         [cf_new_pve_ingress if item.hostname == public_hostname
          else (cf_new_quantum_ingress if quantum_requested and
                item.hostname == quantum_public_hostname else item)] }}
  loop: "{{ cf_saved_ingress | selectattr('hostname', 'defined') | list }}"
  loop_control:
    label: "{{ item.hostname }}"

- name: Add only missing PVE and Quantum routes before the original routes
  ansible.builtin.set_fact:
    cf_desired_ingress: >-
      {{ ([cf_new_pve_ingress] if cf_saved_pve | length == 0 else [])
         + ([cf_new_quantum_ingress] if quantum_requested and
            cf_saved_quantum | length == 0 else [])
         + cf_ordered_ingress
         + [{'service': 'http_status:404'}] }}

- name: Prepare the new Tunnel configuration without losing other settings
  ansible.builtin.set_fact:
    cf_desired_config: >-
      {{ (cf_saved_config if cf_old_tunnel_exists else
          cf_initial_config.json.result.config)
         | combine({'ingress': cf_desired_ingress}) }}

- name: Verify initial configuration remains unchanged before publication
  ansible.builtin.uri:
    url: "{{ cf_api }}/accounts/{{ cf_account_id }}/cfd_tunnel/{{ cf_tunnel_id }}/configurations"
    headers: "{{ cf_headers }}"
    use_proxy: false
    status_code: 200
  register: cf_before_write
  changed_when: false
  no_log: true

- name: Refuse concurrent changes to the newly created Tunnel
  ansible.builtin.assert:
    that:
      - cf_before_write.json.result.config == cf_initial_config.json.result.config
    fail_msg: "CF_CONCURRENT_EDIT_ABORT"

- name: Publish the rebuilt site ingress
  ansible.builtin.uri:
    url: "{{ cf_api }}/accounts/{{ cf_account_id }}/cfd_tunnel/{{ cf_tunnel_id }}/configurations"
    method: PUT
    headers: "{{ cf_headers }}"
    body_format: json
    body:
      config: "{{ cf_desired_config }}"
    use_proxy: false
    status_code: 200
  changed_when: true
  no_log: true

- name: Read back all routes and preserve the unrelated site ingress
  ansible.builtin.uri:
    url: "{{ cf_api }}/accounts/{{ cf_account_id }}/cfd_tunnel/{{ cf_tunnel_id }}/configurations"
    headers: "{{ cf_headers }}"
    use_proxy: false
    status_code: 200
  register: cf_committed_config
  changed_when: false
  no_log: true

- name: Require all saved routes were restored
  ansible.builtin.assert:
    that:
      - cf_committed_config.json.success | bool
      - cf_committed_config.json.result.config.ingress == cf_desired_ingress
      - >-
        (cf_committed_config.json.result.config.ingress
         | selectattr('hostname', 'defined')
         | rejectattr('hostname', 'in', [public_hostname, quantum_public_hostname])
         | list) == cf_foreign_ingress
    fail_msg: "CF_INGRESS_RESTORE_FAILED"

- name: Get only this new Tunnel's connector token
  ansible.builtin.uri:
    url: "{{ cf_api }}/accounts/{{ cf_account_id }}/cfd_tunnel/{{ cf_tunnel_id }}/token"
    headers: "{{ cf_headers }}"
    use_proxy: false
    status_code: 200
  register: cf_pve_token
  changed_when: false
  no_log: true

- name: Install vendor Cloudflare package-signing key
  ansible.builtin.get_url:
    url: https://pkg.cloudflare.com/cloudflare-main.gpg
    dest: /usr/share/keyrings/cloudflare-main.gpg
    owner: root
    group: root
    mode: '0644'

- name: Configure the signed cloudflared APT repository on Runner
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/cloudflared.list
    content: "deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://pkg.cloudflare.com/cloudflared any main\n"
    owner: root
    group: root
    mode: '0644'
  register: cf_pve_apt_source

- name: Install cloudflared without upgrading an already installed version
  ansible.builtin.apt:
    name: cloudflared
    state: present
    update_cache: "{{ cf_pve_apt_source.changed }}"

- name: Ensure root-only connector and site metadata directories
  ansible.builtin.file:
    path: "{{ item }}"
    owner: root
    group: root
    mode: '0700'
    state: directory
  loop:
    - /etc/cloudflared
    - /etc/digitalhouses

- name: Copy the bootstrap-trusted PVE origin CA to Runner
  ansible.builtin.copy:
    src: "{{ pve.ca_file }}"
    dest: "{{ expected_ca_pool }}"
    remote_src: true
    owner: root
    group: root
    mode: '0644'

- name: Store new Tunnel connector token privately
  ansible.builtin.copy:
    dest: /etc/cloudflared/site-token
    content: "{{ cf_pve_token.json.result }}\n"
    owner: root
    group: root
    mode: '0600'
  no_log: true

- name: Save exact new Tunnel ownership UUID on Runner
  ansible.builtin.copy:
    dest: /etc/digitalhouses/site-cloudflare-tunnel-id
    content: "{{ cf_tunnel_id }}\n"
    owner: root
    group: root
    mode: '0600'

- name: Install the standard site cloudflared connector service
  ansible.builtin.copy:
    dest: /etc/systemd/system/digitalhouses-site-cloudflared.service
    owner: root
    group: root
    mode: '0644'
    content: |
      [Unit]
      Description=DigitalHouses owner-object Cloudflare Tunnel
      Wants=network-online.target
      After=network-online.target

      [Service]
      Type=simple
      ExecStart=/usr/bin/cloudflared --no-autoupdate tunnel run --token-file /etc/cloudflared/site-token
      Restart=always
      RestartSec=5

      [Install]
      WantedBy=multi-user.target

- name: Start the new site connector and enable it at boot
  ansible.builtin.systemd_service:
    name: digitalhouses-site-cloudflared.service
    daemon_reload: true
    state: restarted
    enabled: true

- name: Verify the new Tunnel becomes healthy
  ansible.builtin.uri:
    url: "{{ cf_api }}/accounts/{{ cf_account_id }}/cfd_tunnel/{{ cf_tunnel_id }}"
    headers: "{{ cf_headers }}"
    use_proxy: false
    status_code: 200
  register: cf_tunnel_health
  changed_when: false
  until: cf_tunnel_health.json.result.status == 'healthy'
  retries: 12
  delay: 4
  no_log: true

- name: Publish missing DNS only for requested PVE and Quantum endpoints
  ansible.builtin.uri:
    url: "{{ cf_api }}/zones/{{ cf_zone_id }}/dns_records"
    method: POST
    headers: "{{ cf_headers }}"
    body_format: json
    body:
      type: CNAME
      proxied: true
      name: "{{ item.item }}"
      content: "{{ cf_tunnel_id }}.cfargotunnel.com"
    use_proxy: false
    status_code: [200, 201]
  loop: "{{ cf_dns_preflight.results }}"
  when:
    - item.item in cf_required_hostnames
    - item.json.result | length == 0
  changed_when: true
  no_log: true

- name: Move every old site CNAME to the new Tunnel UUID
  ansible.builtin.uri:
    url: "{{ cf_api }}/zones/{{ cf_zone_id }}/dns_records/{{ item.json.result[0].id }}"
    method: PATCH
    headers: "{{ cf_headers }}"
    body_format: json
    body:
      type: CNAME
      proxied: true
      name: "{{ item.item }}"
      content: "{{ cf_tunnel_id }}.cfargotunnel.com"
    use_proxy: false
    status_code: 200
  loop: "{{ cf_dns_preflight.results }}"
  when: item.json.result | length == 1
  changed_when: true
  no_log: true

- name: Read back the DNS of all previously published site applications
  ansible.builtin.uri:
    url: "{{ cf_api }}/zones/{{ cf_zone_id }}/dns_records?name={{ item }}&per_page=100"
    headers: "{{ cf_headers }}"
    use_proxy: false
    status_code: 200
  loop: "{{ (cf_preserved_dns_names + cf_required_hostnames) | unique | list }}"
  register: cf_dns_readback
  changed_when: false
  no_log: true

- name: Require every formerly published application points to the new Tunnel
  ansible.builtin.assert:
    that:
      - item.json.success | bool
      - item.json.result | length == 1
      - item.json.result[0].type == 'CNAME'
      - item.json.result[0].proxied | bool
      - (item.json.result[0].content | lower) == ((cf_tunnel_id ~ '.cfargotunnel.com') | lower)
    fail_msg: "CF_DNS_READBACK_MISMATCH"
  loop: "{{ cf_dns_readback.results }}"
  loop_control:
    label: "{{ item.item }}"
  no_log: true

- name: Require Cloudflare Access challenge for both site admin endpoints
  ansible.builtin.uri:
    url: "https://{{ item }}/"
    follow_redirects: none
    use_proxy: false
    validate_certs: true
    status_code: 302
    timeout: 20
  loop: "{{ cf_required_hostnames }}"
  register: cf_public_challenge
  changed_when: false
  until: >-
    cf_public_challenge.status == 302 and
    (cf_public_challenge.location | default('')) is
    match('^https://[^/]+[.]cloudflareaccess[.]com/cdn-cgi/access/login/.*')
  retries: 8
  delay: 3
  no_log: true

- name: Report newly installed canonical site connector
  ansible.builtin.debug:
    msg:
      - "CF_ACTION={{ requested_mode | upper }}_COMPLETE"
      - "CF_TUNNEL={{ pve_tunnel_name }}"
      - "CF_TUNNEL_ID={{ cf_tunnel_id }}"
      - "CF_CONNECTOR=RUNNER"
      - "CF_OLD_ROUTES_RETAINED={{ cf_foreign_ingress | length }}"
      - "CF_DNS_REBOUND={{ cf_preserved_dns_names | length }}"
      - "CF_PVE=https://{{ public_hostname }}/"
      - "CF_QUANTUM={{ 'READY' if quantum_requested else 'UNCHANGED' }}"
