---
# Migrate exactly one historical Semaphore hostname inside the same dedicated
# tunnel. Stage both ingress names, verify new Access, retire the old one.
# Never recreate the connector or modify unrelated Cloudflare resources.
- name: Identify the exact legacy and staging ingress configurations
  ansible.builtin.set_fact:
    sem_cf_legacy_ingress:
      - hostname: "{{ sem_cf_legacy_hostname }}"
        service: https://127.0.0.1:3000
        originRequest:
          caPool: /etc/semaphore/tls.crt
          noTLSVerify: false
      - service: http_status:404
    sem_cf_staging_ingress: >-
      {{ [{'hostname': sem_cf_legacy_hostname, 'service': 'https://127.0.0.1:3000',
           'originRequest': {'caPool': '/etc/semaphore/tls.crt', 'noTLSVerify': false}},
          sem_cf_desired_config.ingress[0], sem_cf_desired_config.ingress[1]] }}
    sem_cf_original_ingress: >-
      {{ (sem_cf_existing_config.json.result.config | default({})).ingress | default([]) }}

- name: Determine whether the tunnel is new, legacy, staged or already migrated
  ansible.builtin.set_fact:
    sem_cf_name_state: >-
      {{ 'fresh' if sem_cf_existing_config.status == 404 or sem_cf_original_ingress | length == 0
         else 'legacy' if sem_cf_original_ingress == sem_cf_legacy_ingress
         else 'staged' if sem_cf_original_ingress == sem_cf_staging_ingress
         else 'new' if sem_cf_original_ingress == sem_cf_desired_config.ingress else 'foreign' }}

- name: Reject any unexpected origin, foreign ingress or relaxed TLS
  ansible.builtin.assert:
    that:
      - sem_cf_name_state in ['fresh', 'legacy', 'staged', 'new']
    fail_msg: "Semaphore Tunnel has foreign ingress; hostname migration refused"

- name: Read the exact previous Semaphore DNS record
  ansible.builtin.uri:
    url: "{{ sem_cf_api }}/zones/{{ sem_cf_zone_id }}/dns_records?name={{ sem_cf_legacy_hostname }}&per_page=100"
    headers: "{{ sem_cf_headers }}"
    use_proxy: false
    status_code: 200
    timeout: 20
  register: sem_cf_legacy_dns
  changed_when: false
  no_log: true

- name: Require old DNS to be owned by the dedicated Semaphore Tunnel
  ansible.builtin.assert:
    that:
      - sem_cf_legacy_dns.json.success | bool
      - sem_cf_legacy_dns.json.result_info.total_pages | default(1) | int == 1
      - sem_cf_legacy_dns.json.result | length <= 1
      - >-
        sem_cf_legacy_dns.json.result | length == 0 or
        (sem_cf_legacy_dns.json.result[0].type == 'CNAME' and
         sem_cf_legacy_dns.json.result[0].proxied | bool and
         (sem_cf_legacy_dns.json.result[0].content | lower) ==
         ((sem_cf_tunnel_id ~ '.cfargotunnel.com') | lower))
      - sem_cf_name_state not in ['legacy', 'staged'] or sem_cf_legacy_dns.json.result | length == 1
      - sem_cf_name_state != 'fresh' or sem_cf_legacy_dns.json.result | length == 0
    fail_msg: "Unexpected old Semaphore DNS ownership or unfinished foreign migration"
  no_log: true

- name: Report safe Semaphore hostname transition
  ansible.builtin.debug:
    msg:
      - "SEMAPHORE_HOST_STATE={{ sem_cf_name_state }}"
      - "OLD_URL=https://{{ sem_cf_legacy_hostname }}/"
      - "NEW_URL=https://{{ sem_cf_hostname }}/"
      - "LEGACY_DNS_PRESENT={{ sem_cf_legacy_dns.json.result | length == 1 }}"

- name: Temporarily add the new Semaphore hostname while keeping the old route
  ansible.builtin.uri:
    url: "{{ sem_cf_api }}/accounts/{{ sem_cf_account_id }}/cfd_tunnel/{{ sem_cf_tunnel_id }}/configurations"
    method: PUT
    headers: "{{ sem_cf_headers }}"
    body_format: json
    body:
      config: >-
        {{ sem_cf_existing_config.json.result.config |
           combine({'ingress': sem_cf_staging_ingress}) }}
    use_proxy: false
    status_code: 200
    timeout: 30
  changed_when: true
  no_log: true
  when: sem_cf_name_state == 'legacy'

- name: Verify the staging configuration before publishing the new DNS name
  ansible.builtin.uri:
    url: "{{ sem_cf_api }}/accounts/{{ sem_cf_account_id }}/cfd_tunnel/{{ sem_cf_tunnel_id }}/configurations"
    headers: "{{ sem_cf_headers }}"
    use_proxy: false
    status_code: 200
    timeout: 20
  register: sem_cf_stage_readback
  changed_when: false
  no_log: true
  when: sem_cf_name_state in ['legacy', 'staged']

- name: Refuse unexpected changes to the staged ingress rules
  ansible.builtin.assert:
    that:
      - sem_cf_stage_readback.json.success | bool
      - sem_cf_stage_readback.json.result.config.ingress == sem_cf_staging_ingress
    fail_msg: "New Semaphore ingress was not staged; preserving old DNS"
  when: sem_cf_name_state in ['legacy', 'staged']

- name: Publish the new protected Semaphore hostname before removing the old
  ansible.builtin.uri:
    url: "{{ sem_cf_api }}/zones/{{ sem_cf_zone_id }}/dns_records"
    method: POST
    headers: "{{ sem_cf_headers }}"
    body_format: json
    body:
      type: CNAME
      proxied: true
      name: "{{ sem_cf_hostname }}"
      content: "{{ sem_cf_tunnel_id }}.cfargotunnel.com"
    use_proxy: false
    status_code: [200, 201]
    timeout: 30
  changed_when: true
  no_log: true
  when:
    - sem_cf_name_state in ['legacy', 'staged']
    - sem_cf_dns.json.result | length == 0

- name: Confirm the new Semaphore DNS entry points only to our tunnel
  ansible.builtin.uri:
    url: "{{ sem_cf_api }}/zones/{{ sem_cf_zone_id }}/dns_records?name={{ sem_cf_hostname }}&per_page=100"
    headers: "{{ sem_cf_headers }}"
    use_proxy: false
    status_code: 200
    timeout: 20
  register: sem_cf_new_name_dns
  changed_when: false
  no_log: true
  when:
    - sem_cf_name_state in ['legacy', 'staged'] or sem_cf_legacy_dns.json.result | length == 1

- name: Verify exact new protected DNS before retiring old hostname
  ansible.builtin.assert:
    that:
      - sem_cf_new_name_dns.json.success | bool
      - sem_cf_new_name_dns.json.result | length == 1
      - sem_cf_new_name_dns.json.result[0].type == 'CNAME'
      - sem_cf_new_name_dns.json.result[0].proxied | bool
      - >-
        (sem_cf_new_name_dns.json.result[0].content | lower) ==
        ((sem_cf_tunnel_id ~ '.cfargotunnel.com') | lower)
    fail_msg: "New Semaphore public DNS is not ready; old hostname remains"
  when:
    - sem_cf_name_state in ['legacy', 'staged'] or sem_cf_legacy_dns.json.result | length == 1

- name: Resolve the already-working PVE Cloudflare edge without DNS cache delay
  ansible.builtin.command:
    argv: [/usr/bin/getent, ahostsv4, "{{ dev_site_id }}-pve.digitalhouses.vip"]
  register: sem_cf_migration_edge
  changed_when: false
  when:
    - sem_cf_name_state in ['legacy', 'staged'] or sem_cf_legacy_dns.json.result | length == 1

- name: Check the replacement HTTPS hostname is protected by Cloudflare Access
  ansible.builtin.command:
    argv:
      - /usr/bin/curl
      - --silent
      - --show-error
      - --noproxy
      - '*'
      - --connect-timeout
      - '5'
      - --max-time
      - '15'
      - --resolve
      - "{{ sem_cf_hostname }}:443:{{ sem_cf_migration_edge.stdout_lines[0].split()[0] }}"
      - --output
      - /dev/null
      - --write-out
      - '%{http_code} %{redirect_url}'
      - "https://{{ sem_cf_hostname }}/"
  register: sem_cf_migration_access
  changed_when: false
  until: >-
    sem_cf_migration_access.rc == 0 and
    sem_cf_migration_access.stdout is
    match('^302 https://[^/]+\\.cloudflareaccess\\.com/cdn-cgi/access/login/.*')
  retries: 8
  delay: 3
  no_log: true
  when:
    - sem_cf_name_state in ['legacy', 'staged'] or sem_cf_legacy_dns.json.result | length == 1

- name: Remove the retired route after the new public Access challenge passed
  ansible.builtin.uri:
    url: "{{ sem_cf_api }}/accounts/{{ sem_cf_account_id }}/cfd_tunnel/{{ sem_cf_tunnel_id }}/configurations"
    method: PUT
    headers: "{{ sem_cf_headers }}"
    body_format: json
    body:
      config: >-
        {{ sem_cf_existing_config.json.result.config |
           combine({'ingress': sem_cf_desired_config.ingress}) }}
    use_proxy: false
    status_code: 200
    timeout: 30
  changed_when: true
  no_log: true
  when: sem_cf_name_state in ['legacy', 'staged']

- name: Verify only the new Semaphore hostname remains in the tunnel
  ansible.builtin.uri:
    url: "{{ sem_cf_api }}/accounts/{{ sem_cf_account_id }}/cfd_tunnel/{{ sem_cf_tunnel_id }}/configurations"
    headers: "{{ sem_cf_headers }}"
    use_proxy: false
    status_code: 200
    timeout: 20
  register: sem_cf_final_name_config
  changed_when: false
  no_log: true
  when: sem_cf_name_state in ['legacy', 'staged'] or sem_cf_legacy_dns.json.result | length == 1

- name: Verify the old hostname is no longer a route before DNS deletion
  ansible.builtin.assert:
    that:
      - sem_cf_final_name_config.json.success | bool
      - sem_cf_final_name_config.json.result.config.ingress == sem_cf_desired_config.ingress
    fail_msg: "Old DNS remains because new Semaphore ingress readback differs"
  when: sem_cf_name_state in ['legacy', 'staged'] or sem_cf_legacy_dns.json.result | length == 1

- name: Delete the previous Semaphore DNS record immediately after cutover
  ansible.builtin.uri:
    url: "{{ sem_cf_api }}/zones/{{ sem_cf_zone_id }}/dns_records/{{ sem_cf_legacy_dns.json.result[0].id }}"
    method: DELETE
    headers: "{{ sem_cf_headers }}"
    use_proxy: false
    status_code: 200
    timeout: 30
  changed_when: true
  no_log: true
  when: sem_cf_legacy_dns.json.result | length == 1

- name: Confirm the obsolete Semaphore hostname has no Cloudflare DNS record
  ansible.builtin.uri:
    url: "{{ sem_cf_api }}/zones/{{ sem_cf_zone_id }}/dns_records?name={{ sem_cf_legacy_hostname }}&per_page=100"
    headers: "{{ sem_cf_headers }}"
    use_proxy: false
    status_code: 200
    timeout: 20
  register: sem_cf_legacy_dns_final
  changed_when: false
  no_log: true

- name: Require the old Semaphore public DNS name to be fully retired
  ansible.builtin.assert:
    that:
      - sem_cf_legacy_dns_final.json.success | bool
      - sem_cf_legacy_dns_final.json.result | length == 0
    fail_msg: "Old Semaphore DNS still exists and must not remain as an alias"
