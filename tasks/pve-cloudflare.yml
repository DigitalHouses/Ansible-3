---
# Three Cloudflare lifecycle actions: skip, create, recreate.
# The only Tunnel per site is owner-object. Cloudflare Access stays unchanged.

- name: Require site and Cloudflare credentials
  ansible.builtin.assert:
    that:
      - requested_mode in ['create', 'recreate']
      - cf_token | length > 0
      - site_id is match('^[a-z][a-z0-9]*(-[a-z0-9]+)+$')
      - pve.ipv4 is match('^([0-9]{1,3}[.]){3}[0-9]{1,3}$')
    fail_msg: "Cloudflare: provide a token using task 05 and choose create or recreate"
  no_log: true

- name: Verify the TLS origin with the bootstrap-pinned PVE CA
  ansible.builtin.command:
    argv:
      - /usr/bin/curl
      - --silent
      - --show-error
      - --noproxy
      - '*'
      - --cacert
      - "{{ pve.ca_file }}"
      - --connect-timeout
      - '5'
      - --max-time
      - '15'
      - --output
      - /dev/null
      - --write-out
      - '%{http_code}'
      - "{{ desired_origin }}/api2/json/version"
  register: cf_pve_tls
  changed_when: false
  failed_when: cf_pve_tls.rc != 0 or cf_pve_tls.stdout not in ['200', '401']

- name: Read the canonical Cloudflare zone
  ansible.builtin.uri:
    url: "{{ cf_api }}/zones?name={{ cf_zone_name }}&per_page=50"
    headers: "{{ cf_headers }}"
    use_proxy: false
    status_code: 200
  register: cf_zone_response
  changed_when: false
  no_log: true

- name: Identify the exact zone and account
  ansible.builtin.set_fact:
    cf_zone_matches: "{{ cf_zone_response.json.result | selectattr('name', 'equalto', cf_zone_name) | list }}"

- name: Require one Cloudflare zone and its account
  ansible.builtin.assert:
    that:
      - cf_zone_response.json.success | bool
      - cf_zone_matches | length == 1
      - cf_zone_matches[0].account.id is match('^[0-9a-f]{32}$')
    fail_msg: "Cloudflare zone/account not uniquely identified"

- name: Select canonical Cloudflare identifiers
  ansible.builtin.set_fact:
    cf_zone_id: "{{ cf_zone_matches[0].id }}"
    cf_account_id: "{{ cf_zone_matches[0].account.id }}"

- name: Read existing self-hosted Access applications
  ansible.builtin.uri:
    url: "{{ cf_api }}/accounts/{{ cf_account_id }}/access/apps?per_page=100"
    headers: "{{ cf_headers }}"
    use_proxy: false
    status_code: 200
  register: cf_access_apps
  changed_when: false
  no_log: true

- name: Find Access applications covering only the requested PVE endpoints
  ansible.builtin.set_fact:
    cf_access_wildcard: >-
      {{ cf_access_apps.json.result | selectattr('type', 'equalto', 'self_hosted')
         | selectattr('domain', 'defined')
         | selectattr('domain', 'equalto', '*.' ~ cf_zone_name) | list }}
    cf_access_pve_exact: >-
      {{ cf_access_apps.json.result | selectattr('type', 'equalto', 'self_hosted')
         | selectattr('domain', 'defined')
         | selectattr('domain', 'equalto', public_hostname) | list }}
    cf_access_quantum_exact: >-
      {{ cf_access_apps.json.result | selectattr('type', 'equalto', 'self_hosted')
         | selectattr('domain', 'defined')
         | selectattr('domain', 'equalto', quantum_public_hostname) | list }}

- name: Require existing Cloudflare Access protection before publishing
  ansible.builtin.assert:
    that:
      - cf_access_apps.json.success | bool
      - cf_access_apps.json.result_info.total_pages | default(1) | int == 1
      - cf_access_wildcard | length <= 1
      - cf_access_pve_exact | length <= 1
      - cf_access_quantum_exact | length <= 1
      - cf_access_pve_exact | length == 1 or cf_access_wildcard | length == 1
      - >-
        not quantum_requested or cf_access_quantum_exact | length == 1
        or cf_access_wildcard | length == 1
    fail_msg: "Create a restricted self-hosted Cloudflare Access app before using task 10"

- name: Select the narrowest Access policy for each published endpoint
  ansible.builtin.set_fact:
    cf_protecting_access_ids: >-
      {{ ([ (cf_access_pve_exact if cf_access_pve_exact | length == 1
             else cf_access_wildcard)[0].id ]
          + ([ (cf_access_quantum_exact if cf_access_quantum_exact | length == 1
                  else cf_access_wildcard)[0].id ] if quantum_requested else []))
          | unique | list }}

- name: Check each protecting Access policy without exposing identities
  ansible.builtin.uri:
    url: "{{ cf_api }}/accounts/{{ cf_account_id }}/access/apps/{{ item }}/policies?per_page=100"
    headers: "{{ cf_headers }}"
    use_proxy: false
    status_code: 200
  register: cf_access_policies
  loop: "{{ cf_protecting_access_ids }}"
  changed_when: false
  no_log: true

- name: Reject bypass, Everyone and missing email allowlists
  ansible.builtin.assert:
    that:
      - item.json.success | bool
      - item.json.result_info.total_pages | default(1) | int == 1
      - item.json.result | selectattr('decision', 'equalto', 'bypass') | list | length == 0
      - item.json.result | selectattr('decision', 'equalto', 'allow') | list | length > 0
      - >-
        item.json.result | map(attribute='include') | flatten
        | selectattr('everyone', 'defined') | list | length == 0
      - >-
        item.json.result | selectattr('decision', 'equalto', 'allow')
        | map(attribute='include') | flatten
        | selectattr('email', 'defined') | list | length > 0
    fail_msg: "Cloudflare Access must require an allowed email; bypass is forbidden"
  loop: "{{ cf_access_policies.results }}"
  no_log: true

- name: Read the exact owner-object Cloudflare Tunnel
  ansible.builtin.uri:
    url: "{{ cf_api }}/accounts/{{ cf_account_id }}/cfd_tunnel?name={{ pve_tunnel_name }}&per_page=100"
    headers: "{{ cf_headers }}"
    use_proxy: false
    status_code: 200
  register: cf_tunnels
  changed_when: false
  no_log: true

- name: Select the one active site Tunnel
  ansible.builtin.set_fact:
    cf_matching_tunnels: >-
      {{ cf_tunnels.json.result
         | selectattr('name', 'equalto', pve_tunnel_name)
         | selectattr('deleted_at', 'none') | list }}

- name: Require at most one remotely managed site Tunnel
  ansible.builtin.assert:
    that:
      - cf_tunnels.json.success | bool
      - cf_tunnels.json.result_info.total_pages | default(1) | int == 1
      - cf_matching_tunnels | length <= 1
      - cf_matching_tunnels | length == 0 or cf_matching_tunnels[0].config_src == 'cloudflare'
    fail_msg: "CF_SITE_TUNNEL_AMBIGUOUS"

- name: Report create on an existing site Tunnel without touching it
  ansible.builtin.debug:
    msg: >-
      CF_ACTION=CREATE_EXISTING_UNCHANGED;
      TUNNEL={{ pve_tunnel_name }};
      STATUS={{ cf_matching_tunnels[0].status }}
  when:
    - requested_mode == 'create'
    - cf_matching_tunnels | length == 1

- name: Prepare a new or explicitly recreated site Tunnel
  ansible.builtin.include_tasks:
    file: pve-cloudflare-apply.yml
    apply:
      become: true
  when:
    - requested_mode == 'recreate' or cf_matching_tunnels | length == 0
