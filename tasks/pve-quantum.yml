---
# FileBrowser Quantum administrative full-root view.
# Upstream discourages / sources because indexing the host is unsafe:
# global viewable=true explicitly disables indexing for this source.
- name: Require x86_64 for the pinned Quantum binary
  ansible.builtin.command: /usr/bin/uname -m
  register: pve_architecture
  changed_when: false

- name: Refuse an unsupported Quantum architecture
  ansible.builtin.assert:
    that: pve_architecture.stdout == 'x86_64'
    fail_msg: "No pinned Quantum binary for this PVE architecture"

- name: Inspect existing Quantum systemd unit
  ansible.builtin.stat:
    path: /etc/systemd/system/digitalhouses-filebrowser.service
  register: quantum_service

- name: Inspect existing Quantum config
  ansible.builtin.stat:
    path: /etc/digitalhouses/filebrowser-quantum.yml
  register: quantum_config

- name: Check an existing upstream FileBrowser service
  ansible.builtin.command:
    argv: [/usr/bin/systemctl, show, filebrowser.service, --property=LoadState, --value]
  register: upstream_filebrowser_service
  changed_when: false

# Existing upstream filebrowser.service is not owned by Ansible-3.
# If it is already a secure management-IP service, use it without changing it.
- name: Inspect the legacy FileBrowser service state
  ansible.builtin.command:
    argv: [/usr/bin/systemctl, is-active, filebrowser.service]
  register: quantum_legacy_active
  changed_when: false
  failed_when: false
  when: upstream_filebrowser_service.stdout == 'loaded'

- name: Identify an already running independent FileBrowser installation
  ansible.builtin.set_fact:
    quantum_use_legacy: >-
      {{ upstream_filebrowser_service.stdout == 'loaded'
         and quantum_legacy_active.stdout | default('') == 'active'
         and not quantum_service.stat.exists }}

- name: Refuse ambiguous or partially managed FileBrowser installations
  ansible.builtin.assert:
    that:
      - not quantum_service.stat.exists or quantum_config.stat.exists
      - >-
        upstream_filebrowser_service.stdout == 'not-found' or
        quantum_use_legacy or
        (quantum_service.stat.exists and
         quantum_legacy_active.stdout | default('') != 'active')
    fail_msg: >-
      FileBrowser ownership conflict: stop. A pre-existing service must be
      running on the management IP with verified password authentication;
      Ansible will not remove it or run a duplicate privileged instance.

- name: Check the existing independent FileBrowser health
  ansible.builtin.uri:
    url: "http://{{ quantum_bind_ipv4 }}:8090/health"
    use_proxy: false
    status_code: 200
    timeout: 10
  register: quantum_legacy_health
  changed_when: false
  when: quantum_use_legacy

- name: Verify independent FileBrowser rejects anonymous administration
  ansible.builtin.uri:
    url: "http://{{ quantum_bind_ipv4 }}:8090/api/users"
    use_proxy: false
    status_code: [401, 403]
    timeout: 10
  register: quantum_legacy_auth
  changed_when: false
  when: quantum_use_legacy

- name: Confirm independent FileBrowser is accessible from Runner LAN
  ansible.builtin.uri:
    url: "http://{{ quantum_bind_ipv4 }}:8090/health"
    use_proxy: false
    status_code: 200
    timeout: 10
  delegate_to: runner
  changed_when: false
  when: quantum_use_legacy

- name: Report accepted existing independent FileBrowser
  ansible.builtin.debug:
    msg: >-
      QUANTUM=EXISTING_VERIFIED; existing filebrowser.service retained;
      management_ip={{ quantum_bind_ipv4 }}, auth=REQUIRED, no reinstall.
  when: quantum_use_legacy

- name: Install or reconcile only DigitalHouses-managed Quantum
  ansible.builtin.include_tasks: pve-quantum-managed.yml
  when: not quantum_use_legacy
