---
- name: Enroll DEV access on an existing local Runner
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  vars:
    semaphore_api: https://127.0.0.1:3000/api
    semaphore_ca: /etc/semaphore/tls.crt
  tasks:
    - name: Validate site
      ansible.builtin.assert:
        that: site_id is match('^[a-z][a-z0-9]*(-[a-z0-9]+)+$')

    - name: Read existing admin catalog token
      ansible.builtin.slurp:
        src: /etc/semaphore/catalog-token
      register: dev_catalog_secret
      no_log: true

    - name: Retain admin credential only in memory
      ansible.builtin.set_fact:
        dev_admin_token: "{{ dev_catalog_secret.content | b64decode | trim }}"
      no_log: true

    - name: Find site project
      ansible.builtin.uri:
        url: "{{ semaphore_api }}/projects"
        headers:
          Authorization: "Bearer {{ dev_admin_token }}"
        ca_path: "{{ semaphore_ca }}"
        validate_certs: true
        use_proxy: false
      register: dev_site_projects
      no_log: true

    - name: Require exactly one matching site project
      ansible.builtin.assert:
        that: dev_site_projects.json | selectattr('name', 'equalto', site_id) | list | length == 1
      no_log: true

    - name: Enroll dedicated access
      ansible.builtin.import_tasks: tasks/dev-access.yml
      vars:
        dev_project_id: "{{ (dev_site_projects.json | selectattr('name', 'equalto', site_id) | first).id }}"
