          WantedBy=multi-user.target

    - name: Start Semaphore
      ansible.builtin.systemd_service:
        name: digitalhouses-semaphore.service
        daemon_reload: true
        state: started
        enabled: true

    - name: Publish normal Debian mDNS hostname
      ansible.builtin.systemd_service:
        name: avahi-daemon.service
        state: started
        enabled: true

    - name: Wait for Semaphore HTTPS listener
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 3000
        delay: 1
        timeout: 60

    - name: Authenticate with localhost Semaphore API
      ansible.builtin.uri:
        url: "{{ semaphore_api }}/auth/login"
        method: POST
        body_format: json
        body:
